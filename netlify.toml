# Netlify build settings. The project is a Vite app: build with `npm run build`, publish `dist`.
# (Previously `publish = "public"`, which would have deployed raw source assets instead of the built site.)
[build]
  command = "npm run build"
  publish = "dist"
  functions = "netlify/functions"

[build.environment]
  NODE_VERSION = "22"

[build.processing]
  skip_processing = false

[build.processing.html]
  pretty_urls = false

# Exact app rewrites are generated into dist/_redirects. Unmatched URLs use dist/404.html with status 404.
# The first-party API remains mounted at /api/* by netlify/functions/api.mjs.

# Permanent redirects (301) — only where a relevant replacement exists
[[redirects]]
  from = "/projects/camlink"
  to = "/projects/proboy-camlink"
  status = 301
  force = true

[[redirects]]
  from = "/projects/js-obfuscator"
  to = "/projects/proboy-js-obfuscator"
  status = 301
  force = true

[[redirects]]
  from = "/projects/sim-database"
  to = "/projects/proboy-sim-database"
  status = 301
  force = true

[[redirects]]
  from = "/projects/md-pairing"
  to = "/proboy-md"
  status = 301
  force = true

[[redirects]]
  from = "/showcase/luxecart"
  to = "/demos/luxecart-store"
  status = 301
  force = true

# Headers
[[headers]]
  for = "/*"
  [headers.values]
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"
    X-Frame-Options = "SAMEORIGIN"
    Permissions-Policy = "camera=(), microphone=(), geolocation=()"

[[headers]]
  for = "/admin"
  [headers.values]
    X-Robots-Tag = "noindex, nofollow"

[[headers]]
  for = "/demos/control-room"
  [headers.values]
    X-Robots-Tag = "noindex, follow"

[[headers]]
  for = "/assets/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "/images/*"
  [headers.values]
    Cache-Control = "public, max-age=2592000, stale-while-revalidate=86400"

[[headers]]
  for = "/images/og-shahan-ali.jpg"
  [headers.values]
    Cache-Control = "public, max-age=3600, must-revalidate"

[[headers]]
  for = "/obfuscator/*"
  [headers.values]
    X-Robots-Tag = "noindex, nofollow"

[[headers]]
  for = "/sim.html"
  [headers.values]
    X-Robots-Tag = "noindex, nofollow"

[[headers]]
  for = "/encrypt&decrypt.html"
  [headers.values]
    X-Robots-Tag = "noindex, nofollow"

[[headers]]
  for = "/favicon*"
  [headers.values]
    Cache-Control = "public, max-age=86400, stale-while-revalidate=604800"

[[headers]]
  for = "/apple-touch-icon.png"
  [headers.values]
    Cache-Control = "public, max-age=86400, stale-while-revalidate=604800"

[[headers]]
  for = "/intro-animation/*"
  [headers.values]
    Cache-Control = "public, max-age=86400"

