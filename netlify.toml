# Netlify build settings. The project is a Vite app: build with `npm run build`, publish `dist`.
# (Previously `publish = "public"`, which would have deployed raw source assets instead of the built site.)
[build]
  command = "npm run build"
  publish = "dist"
  functions = "netlify/functions"

[build.environment]
  NODE_VERSION = "22"
  PROBOY_SPLIT_ASSETS = "1"

[build.processing]
  skip_processing = false

# NOTE: there is intentionally no `/* -> /index.html` SPA fallback. Every public route is prerendered to
# its own HTML file at build time, and unknown URLs must return a real 404 (served from dist/404.html).
# The first-party API lives in netlify/functions/api.mjs and is mounted at /api/* via its in-file config.

# Rewrites (status 200)
[[redirects]]
  from = "/admin"
  to = "/admin/index"
  status = 200

[[redirects]]
  from = "/blog"
  to = "/blog/index"
  status = 200

[[redirects]]
  from = "/blog/:slug"
  to = "/blog/:slug/index"
  status = 200

[[redirects]]
  from = "/proboy-md/docs"
  to = "/proboy-md/docs/index"
  status = 200

[[redirects]]
  from = "/proboy-md/docs/:slug"
  to = "/proboy-md/docs/:slug/index"
  status = 200

# Permanent redirects (301) — only where a relevant replacement exists
[[redirects]]
  from = "/projects/camlink"
  to = "/projects/proboy-camlink"
  status = 301
  force = true

[[redirects]]
  from = "/projects/js-obfuscator"
  to = "/projects/proboy-js-obfuscator"
  status = 301
  force = true

[[redirects]]
  from = "/projects/sim-database"
  to = "/projects/proboy-sim-database"
  status = 301
  force = true

[[redirects]]
  from = "/projects/md-pairing"
  to = "/proboy-md"
  status = 301
  force = true

[[redirects]]
  from = "/showcase/luxecart"
  to = "/demos/luxecart-store"
  status = 301
  force = true

# Headers
[[headers]]
  for = "/*"
  [headers.values]
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"
    X-Frame-Options = "SAMEORIGIN"
    Permissions-Policy = "camera=(), microphone=(), geolocation=()"

[[headers]]
  for = "/admin"
  [headers.values]
    X-Robots-Tag = "noindex, nofollow"

[[headers]]
  for = "/demos/control-room"
  [headers.values]
    X-Robots-Tag = "noindex, follow"

[[headers]]
  for = "/images/*"
  [headers.values]
    Cache-Control = "public, max-age=2592000, stale-while-revalidate=86400"

[[headers]]
  for = "/favicon*"
  [headers.values]
    Cache-Control = "public, max-age=86400, stale-while-revalidate=604800"

[[headers]]
  for = "/apple-touch-icon.png"
  [headers.values]
    Cache-Control = "public, max-age=86400, stale-while-revalidate=604800"

[[headers]]
  for = "/intro-animation/*"
  [headers.values]
    Cache-Control = "public, max-age=86400"

# Utility / template / legacy pages: reachable, but kept out of search results (header-only, files untouched)
