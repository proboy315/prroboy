elines and one-click apply, plus a recruiter admin.</li><li><a href="/showcase/shiptrack">ShipTrack</a> — Concept logistics dashboard for container status, ETAs and port logs, with a logistics admin.</li><li><a href="/showcase/stayora">Stayora</a> — Concept hotel site for villas and penthouses with plunge-pool stays and a hotel admin.</li><li><a href="/showcase/finova">Finova</a> — Concept finance dashboard for net worth, spending and savings goals, with a finance admin.</li><li><a href="/showcase/securepass">SecurePass</a> — Concept password-vault interface with a generator screen and a security admin. A UI demo only.</li><li><a href="/showcase/cloudpanel">CloudPanel</a> — Concept hosting panel with CPU and memory charts, a terminal-style panel and a container list.</li><li><a href="/showcase/shopadmin">ShopAdmin</a> — Concept store admin for revenue, stock alerts, order statuses and fulfillment.</li><li><a href="/showcase/vortex">Vortex</a> — Concept creative studio site built around canvas, shader and particle visuals, with a director admin.</li><li><a href="/showcase/prohub">ProHub</a> — Concept freelancer marketplace with talent profiles, hourly hiring, escrow states and a platform admin.</li></ul><h2>Interactive demo websites by Shahan Ali (ProBoy)</h2><ul><li><a href="/demos/luxecart-store">LuxeCart</a> — Premium e-commerce store: Product catalogue with live search, category filters, working cart, quantity controls and a validated checkout demonstration. Works: Live search and category filters, Add to cart with quantities, Persistent cart panel, Validated checkout form.</li><li><a href="/demos/pulse-dashboard">Pulse</a> — SaaS analytics dashboard: Sidebar navigation, tabbed overview, interactive SVG charts, metric cards and a settings panel with toggles. Works: Sidebar + tab navigation, Interactive SVG charts, Range selector recalculates data, Settings toggles.</li><li><a href="/demos/ember-kitchen">Ember Kitchen</a> — Restaurant website: Menu browsing by course, a reservation form with validation and confirmation, plus opening hours and contact details. Works: Menu filter by course, Reservation form validation, Confirmation state, Hours and directions.</li><li><a href="/demos/haven-properties">Haven</a> — Real estate listings: Property search with filters for type, bedrooms and price, expandable listing details and an agent enquiry form. Works: Multi-criteria filtering, Expandable property details, Empty-results state, Enquiry form validation.</li><li><a href="/demos/northline-agency">Northline</a> — Creative agency site: Services, selected work, a small team section and a project enquiry form with real validation and success feedback. Works: Services and case studies, Team section, Enquiry form with errors, Success confirmation.</li><li><a href="/demos/synth-ai-studio">Synth Studio</a> — AI tool interface: Prompt input, model and tone selectors, character counter and a deterministic sample response generator that runs entirely in the browser. Works: Prompt input with counter, Model and tone selectors, Generated sample responses, Prompt history.</li><li><a href="/demos/forge-docs">Forge Docs</a> — Developer documentation: Documentation layout with sidebar navigation, in-page search across sections and copyable code examples. Works: Sidebar navigation, Client-side section search, Copyable code snippets, Responsive reading layout.</li></ul><h2>ProBoy-MD commands</h2><p>ProBoy-MD v6.0.1, prefix .. The menu generated 4 November 2026 reported 531 commands; parsing the repository found 224 command files across 9 categories (admin 3, ai 49, dev 29, fun 43, general 25, group 25, media 12, textmaker 19, utility 19). Pairing website: <a href="https://proboy-md.gt.tc/">https://proboy-md.gt.tc/</a>.</p><p>Certificate: Certificate of recognition awarded to Shahan (Shahan Ali) for Google Gemini QuizOff 2026, organised by CampusCrew and hosted on Unstop</p><h2>About Shahan Ali</h2><p>Shahan Ali (ProBoy) is a full-stack developer, bot
