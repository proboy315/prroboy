<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ShopAdmin | Multi-Store E-Commerce Order Operations</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <script src="https://unpkg.com/lucide@latest"></script>
    <style>
        body { font-family: 'Plus Jakarta Sans', sans-serif; background-color: #0A0D14; color: #F8FAFC; }
    </style>
</head>
<body class="bg-slate-950 text-slate-100 antialiased min-h-screen">

    <header class="sticky top-0 z-40 bg-slate-900/90 backdrop-blur-xl border-b border-slate-800">
        <div class="max-w-7xl mx-auto px-6 h-16 flex items-center justify-between">
            <a href="#" class="flex items-center gap-2">
                <div class="w-8 h-8 rounded-xl bg-orange-500 flex items-center justify-center text-white font-bold">SA</div>
                <span class="font-extrabold text-xl tracking-tight text-white">Shop<span class="text-orange-400">Admin</span></span>
            </a>

            <div class="flex items-center gap-3 text-xs font-bold">
                <button onclick="openShowcaseAdmin()" class="px-2.5 py-1.5 rounded-lg bg-emerald-500/10 border border-emerald-500/30 hover:border-emerald-400 text-emerald-400 text-xs font-bold flex items-center gap-1.5 cursor-pointer transition-all shadow-sm">
                    <i data-lucide="shield-check" class="w-3.5 h-3.5"></i> Admin
                </button>
                <a href="/#projects" class="text-slate-400 hover:text-white flex items-center gap-1">
                    <i data-lucide="arrow-left" class="w-4 h-4"></i> Portfolio
                </a>
            </div>
        </div>
    </header>

    <main class="max-w-7xl mx-auto px-6 py-8 space-y-8">
        <div class="grid grid-cols-1 sm:grid-cols-3 gap-6">
            <div class="p-6 rounded-3xl bg-slate-900 border border-slate-800">
                <span class="text-xs text-slate-400">Today's Store Sales</span>
                <span class="text-2xl font-bold text-emerald-400 block mt-1">$18,420.00</span>
            </div>
            <div class="p-6 rounded-3xl bg-slate-900 border border-slate-800">
                <span class="text-xs text-slate-400">Orders to Fulfill</span>
                <span class="text-2xl font-bold text-orange-400 block mt-1">42 Orders</span>
            </div>
            <div class="p-6 rounded-3xl bg-slate-900 border border-slate-800">
                <span class="text-xs text-slate-400">Low Stock Alert</span>
                <span class="text-2xl font-bold text-red-400 block mt-1">3 Products</span>
            </div>
        </div>

        <div class="p-6 rounded-3xl bg-slate-900 border border-slate-800 space-y-4">
            <h3 class="text-base font-bold text-white">Recent Store Orders</h3>
            <div class="space-y-2 text-xs">
                <div class="p-3 rounded-xl bg-slate-950 border border-slate-800 flex items-center justify-between">
                    <div>
                        <strong class="text-white block">#ORD-8841 · Sarah Connor</strong>
                        <span class="text-slate-400">2 Items · $180.00</span>
                    </div>
                    <span class="px-2.5 py-1 rounded-full bg-emerald-500/10 text-emerald-400 font-bold">Shipped</span>
                </div>
                <div class="p-3 rounded-xl bg-slate-950 border border-slate-800 flex items-center justify-between">
                    <div>
                        <strong class="text-white block">#ORD-8842 · Michael Scott</strong>
                        <span class="text-slate-400">1 Item · $320.00</span>
                    </div>
                    <span class="px-2.5 py-1 rounded-full bg-orange-500/10 text-orange-400 font-bold">Processing</span>
                </div>
            </div>
        </div>
    </main>

    <script>
        lucide.createIcons();
    </script>
    <script src="/showcase/admin.js"></script>
</body>
</html>
