<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Finova | Next-Gen Financial Intelligence & Wealth</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&family=Fira+Code:wght@400;600&display=swap" rel="stylesheet">
    <script src="https://unpkg.com/lucide@latest"></script>
    <style>
        body { font-family: 'Plus Jakarta Sans', sans-serif; background-color: #080C14; color: #F8FAFC; }
        .font-mono { font-family: 'Fira Code', monospace; }
    </style>
</head>
<body class="bg-slate-950 text-slate-100 antialiased min-h-screen">

    <header class="sticky top-0 z-40 bg-slate-900/90 backdrop-blur-xl border-b border-slate-800">
        <div class="max-w-7xl mx-auto px-6 h-16 flex items-center justify-between">
            <a href="#" class="flex items-center gap-2">
                <div class="w-8 h-8 rounded-xl bg-emerald-500 flex items-center justify-center text-slate-950 font-black">F</div>
                <span class="font-extrabold text-xl tracking-tight text-white">Fin<span class="text-emerald-400">ova</span></span>
            </a>

            <div class="flex items-center gap-4 text-xs font-bold">
                <a href="/#projects" class="text-slate-400 hover:text-white flex items-center gap-1">
                    <i data-lucide="arrow-left" class="w-4 h-4"></i> Portfolio
                </a>
            </div>
        </div>
    </header>

    <main class="max-w-7xl mx-auto px-6 py-8 space-y-8">
        
        <div class="p-6 rounded-3xl bg-slate-900 border border-slate-800 grid grid-cols-1 md:grid-cols-3 gap-6">
            <div>
                <span class="text-xs text-slate-400 font-mono">Total Portfolio Wealth</span>
                <span class="text-3xl font-black text-emerald-400 block mt-1">$124,850.40</span>
                <span class="text-[11px] text-emerald-400 font-mono">▲ +12.4% this month</span>
            </div>
            <div>
                <span class="text-xs text-slate-400 font-mono">Monthly Income</span>
                <span class="text-2xl font-bold text-white block mt-1">$9,400.00</span>
            </div>
            <div>
                <span class="text-xs text-slate-400 font-mono">Monthly Expenses</span>
                <span class="text-2xl font-bold text-slate-300 block mt-1">$3,120.00</span>
            </div>
        </div>

        <div class="p-6 rounded-3xl bg-slate-900 border border-slate-800 space-y-4">
            <h3 class="text-base font-bold text-white">Savings Goal: MacBook Pro M3 Max</h3>
            <div class="flex justify-between text-xs font-mono">
                <span class="text-slate-400">$2,400 saved</span>
                <span class="text-emerald-400">$3,200 goal (75%)</span>
            </div>
            <div class="w-full bg-slate-800 h-3 rounded-full overflow-hidden">
                <div class="bg-emerald-400 h-full w-[75%] rounded-full"></div>
            </div>
        </div>

    </main>

    <script>
        lucide.createIcons();
    </script>
</body>
</html>
