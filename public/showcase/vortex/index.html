<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>VORTEX | Experimental 3D Immersive Web Experience</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Syne:wght@700;800&family=Plus+Jakarta+Sans:wght@400;600&display=swap" rel="stylesheet">
    <script src="https://unpkg.com/lucide@latest"></script>
    <style>
        body { font-family: 'Plus Jakarta Sans', sans-serif; background-color: #030305; color: #F8FAFC; overflow-x: hidden; }
        .font-syne { font-family: 'Syne', sans-serif; }
        .glow-sphere { background: radial-gradient(circle, rgba(168,85,247,0.4) 0%, rgba(59,130,246,0.1) 60%, transparent 100%); }
    </style>
</head>
<body class="bg-black text-white antialiased min-h-screen flex flex-col justify-between">

    <header class="p-6 flex items-center justify-between z-20">
        <span class="font-syne text-2xl font-black tracking-widest bg-gradient-to-r from-purple-400 to-cyan-400 text-transparent bg-clip-text">VORTEX</span>
        <div class="flex items-center gap-3">
            <button onclick="openShowcaseAdmin()" class="px-2.5 py-1.5 rounded-lg bg-emerald-500/10 border border-emerald-500/30 hover:border-emerald-400 text-emerald-400 text-xs font-bold flex items-center gap-1.5 cursor-pointer transition-all shadow-sm">
                <i data-lucide="shield-check" class="w-3.5 h-3.5"></i> Admin
            </button>
            <a href="/#projects" class="text-xs text-slate-400 hover:text-white flex items-center gap-1">
                <i data-lucide="arrow-left" class="w-4 h-4"></i> Portfolio
            </a>
        </div>
    </header>

    <main class="relative py-24 flex-1 flex items-center justify-center text-center px-6">
        <div class="w-96 h-96 rounded-full glow-sphere absolute -z-10 blur-3xl animate-pulse"></div>
        <div class="space-y-6 max-w-3xl">
            <span class="px-4 py-1.5 rounded-full border border-purple-500/40 bg-purple-500/10 text-purple-300 text-xs uppercase tracking-widest font-mono">
                Interactive Canvas Experience
            </span>
            <h1 class="text-5xl sm:text-7xl font-black font-syne tracking-tight leading-none">
                ENTER THE <br/><span class="bg-gradient-to-r from-purple-400 via-pink-400 to-cyan-400 text-transparent bg-clip-text">VORTEX</span>
            </h1>
            <p class="text-xs sm:text-sm text-slate-400 max-w-lg mx-auto">
                Boundary-pushing experimental creative web architecture utilizing WebGL, fluid motion dynamics, and spatial UI layout.
            </p>
            <button onclick="alert('Portal Portal Activated!')" class="px-8 py-4 rounded-full bg-gradient-to-r from-purple-500 to-cyan-500 text-black font-extrabold text-xs uppercase tracking-widest hover:scale-105 transition-all">
                Initialize Portal Phase
            </button>
        </div>
    </main>

    <footer class="p-6 text-center text-xs text-slate-600 font-mono">
        VORTEX ARCHITECTURE · PROBOY DESIGN LABS
    </footer>

    <script>
        lucide.createIcons();
    </script>
    <script src="/showcase/admin.js"></script>
</body>
</html>
