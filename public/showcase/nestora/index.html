<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Nestora | Premium Real Estate & Modern Homes</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
    <script src="https://unpkg.com/lucide@latest"></script>
    <style>
        body { font-family: 'Plus Jakarta Sans', sans-serif; background-color: #0B0F19; color: #E2E8F0; }
    </style>
</head>
<body class="bg-slate-950 text-slate-100 antialiased min-h-screen">

    <!-- Header -->
    <header class="sticky top-0 z-40 bg-slate-950/80 backdrop-blur-xl border-b border-white/10">
        <div class="max-w-7xl mx-auto px-6 h-20 flex items-center justify-between">
            <a href="#" class="flex items-center gap-3">
                <div class="w-10 h-10 rounded-2xl bg-gradient-to-tr from-cyan-500 to-blue-600 flex items-center justify-center text-slate-950 font-black text-xl shadow-lg shadow-cyan-500/20">N</div>
                <span class="font-extrabold text-2xl tracking-tight text-white">Nest<span class="text-cyan-400">ora</span></span>
            </a>

            <div class="flex items-center gap-4">
                <button onclick="toggleMortgageModal()" class="px-4 py-2 rounded-xl bg-white/5 border border-white/10 hover:border-cyan-400 text-xs font-bold text-cyan-300 flex items-center gap-2 transition-all">
                    <i data-lucide="calculator" class="w-4 h-4"></i>
                    <span>Mortgage Calculator</span>
                </button>
                <a href="/#projects" class="text-xs text-slate-400 hover:text-white flex items-center gap-1">
                    <i data-lucide="arrow-left" class="w-4 h-4"></i> Portfolio
                </a>
            </div>
        </div>
    </header>

    <!-- Hero Search -->
    <section class="relative py-20 bg-slate-900 border-b border-white/10 overflow-hidden">
        <div class="absolute inset-0 bg-[radial-gradient(ellipse_at_top,_var(--tw-gradient-stops))] from-cyan-900/20 via-slate-950 to-slate-950"></div>
        <div class="max-w-7xl mx-auto px-6 relative z-10 space-y-8 text-center max-w-3xl">
            <span class="px-3.5 py-1.5 rounded-full bg-cyan-500/10 border border-cyan-500/20 text-cyan-300 text-xs font-semibold uppercase tracking-widest">
                Curated Luxury Living
            </span>
            <h1 class="text-4xl sm:text-6xl font-black text-white tracking-tight leading-tight">
                Find Your Sanctuary of <span class="bg-gradient-to-r from-cyan-300 to-blue-400 text-transparent bg-clip-text">Modern Elegance</span>
            </h1>

            <!-- Search Panel -->
            <div class="p-4 rounded-3xl bg-slate-950/80 border border-white/15 backdrop-blur-2xl shadow-2xl text-left space-y-4">
                <div class="flex border-b border-white/10 pb-3 gap-6 text-xs font-bold uppercase tracking-wider">
                    <button class="text-cyan-400 border-b-2 border-cyan-400 pb-2">Buy Homes</button>
                    <button class="text-slate-400 hover:text-white pb-2">Rent Estates</button>
                </div>
                <div class="grid grid-cols-1 sm:grid-cols-4 gap-3">
                    <input id="loc-input" type="text" placeholder="Location (e.g. Aspen, Malibu)" class="p-3 rounded-xl bg-white/5 border border-white/10 text-xs text-white outline-none focus:border-cyan-400">
                    <select id="type-select" class="p-3 rounded-xl bg-slate-900 border border-white/10 text-xs text-white outline-none">
                        <option value="all">All Types</option>
                        <option value="Villa">Villa</option>
                        <option value="Penthouse">Penthouse</option>
                        <option value="Estate">Estate</option>
                    </select>
                    <select id="price-select" class="p-3 rounded-xl bg-slate-900 border border-white/10 text-xs text-white outline-none">
                        <option value="all">Any Price</option>
                        <option value="2000000">Under $2M</option>
                        <option value="5000000">Under $5M</option>
                    </select>
                    <button onclick="filterProperties()" class="p-3 rounded-xl bg-gradient-to-r from-cyan-500 to-blue-600 text-slate-950 font-bold text-xs uppercase tracking-wider hover:opacity-90">
                        Search Estates
                    </button>
                </div>
            </div>
        </div>
    </section>

    <!-- Property Grid -->
    <main class="max-w-7xl mx-auto px-6 py-16">
        <div class="flex items-center justify-between mb-10">
            <h2 class="text-2xl font-bold text-white">Featured Architectural Masterpieces</h2>
            <span class="text-xs text-slate-400">Showing verified luxury properties</span>
        </div>

        <div id="property-grid" class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-8">
            <!-- Rendered dynamically -->
        </div>
    </main>

    <!-- Mortgage Calculator Modal -->
    <div id="mortgage-modal" class="fixed inset-0 z-50 bg-slate-950/80 backdrop-blur-md hidden flex items-center justify-center p-4">
        <div class="bg-slate-900 border border-white/15 rounded-3xl max-w-lg w-full p-6 relative space-y-6">
            <button onclick="toggleMortgageModal()" class="absolute top-4 right-4 text-slate-400 hover:text-white"><i data-lucide="x" class="w-5 h-5"></i></button>
            <div class="flex items-center gap-3">
                <div class="w-10 h-10 rounded-2xl bg-cyan-500/20 text-cyan-300 flex items-center justify-center"><i data-lucide="calculator" class="w-5 h-5"></i></div>
                <div>
                    <h3 class="text-lg font-bold text-white">Mortgage Estimator</h3>
                    <p class="text-xs text-slate-400">Calculate real-time monthly financing</p>
                </div>
            </div>

            <div class="space-y-4 text-xs">
                <div>
                    <label class="text-slate-300 font-semibold mb-1 block">Property Price ($)</label>
                    <input id="calc-price" type="number" value="2500000" class="w-full p-3 rounded-xl bg-slate-950 border border-white/10 text-white outline-none focus:border-cyan-400">
                </div>
                <div class="grid grid-cols-2 gap-3">
                    <div>
                        <label class="text-slate-300 font-semibold mb-1 block">Down Payment (%)</label>
                        <input id="calc-down" type="number" value="20" class="w-full p-3 rounded-xl bg-slate-950 border border-white/10 text-white outline-none focus:border-cyan-400">
                    </div>
                    <div>
                        <label class="text-slate-300 font-semibold mb-1 block">Interest Rate (%)</label>
                        <input id="calc-rate" type="number" value="6.5" step="0.1" class="w-full p-3 rounded-xl bg-slate-950 border border-white/10 text-white outline-none focus:border-cyan-400">
                    </div>
                </div>
                <div>
                    <label class="text-slate-300 font-semibold mb-1 block">Loan Period (Years)</label>
                    <select id="calc-years" class="w-full p-3 rounded-xl bg-slate-950 border border-white/10 text-white outline-none">
                        <option value="30">30 Years</option>
                        <option value="15">15 Years</option>
                    </select>
                </div>
                <button onclick="computeMortgage()" class="w-full py-3.5 rounded-xl bg-cyan-400 text-slate-950 font-bold uppercase tracking-wider">Calculate Payment</button>
            </div>

            <div class="p-4 rounded-2xl bg-slate-950 border border-cyan-500/30 text-center">
                <span class="text-xs text-slate-400 block">Estimated Monthly Payment</span>
                <span id="calc-result" class="text-2xl font-black text-cyan-300">$12,641 / mo</span>
            </div>
        </div>
    </div>

    <script>
        lucide.createIcons();

        const properties = [
            { id: 1, title: "Glasshouse Sanctuary", location: "Aspen, Colorado", price: 4200000, beds: 5, baths: 6, area: "6,400 sqft", type: "Estate", img: "https://images.unsplash.com/photo-1600596542815-ffad4c1539a9?auto=format&fit=crop&w=800&q=80" },
            { id: 2, title: "Oceanfront Horizon Villa", location: "Malibu, California", price: 6800000, beds: 6, baths: 7, area: "8,100 sqft", type: "Villa", img: "https://images.unsplash.com/photo-1600585154340-be6161a56a0c?auto=format&fit=crop&w=800&q=80" },
            { id: 3, title: "Skyline Tower Penthouse", location: "Manhattan, New York", price: 3500000, beds: 3, baths: 4, area: "3,800 sqft", type: "Penthouse", img: "https://images.unsplash.com/photo-1512917774080-9991f1c4c750?auto=format&fit=crop&w=800&q=80" },
            { id: 4, title: "Minimalist Desert Residence", location: "Scottsdale, Arizona", price: 1950000, beds: 4, baths: 4, area: "4,200 sqft", type: "Villa", img: "https://images.unsplash.com/photo-1600607687939-ce8a6c25118c?auto=format&fit=crop&w=800&q=80" },
            { id: 5, title: "Coastal Pine Manor", location: "Carmel, California", price: 5100000, beds: 5, baths: 5, area: "5,900 sqft", type: "Estate", img: "https://images.unsplash.com/photo-1600566753376-12c8ab7fb75b?auto=format&fit=crop&w=800&q=80" },
            { id: 6, title: "The Alpine Ridge Lodge", location: "Vail, Colorado", price: 2800000, beds: 4, baths: 5, area: "4,800 sqft", type: "Villa", img: "https://images.unsplash.com/photo-1600585152220-90363fe7e115?auto=format&fit=crop&w=800&q=80" }
        ];

        function renderProperties(list = properties) {
            const grid = document.getElementById('property-grid');
            grid.innerHTML = list.map(p => `
                <div class="bg-slate-900 border border-white/10 rounded-3xl overflow-hidden hover:border-cyan-400/40 transition-all group flex flex-col justify-between">
                    <div class="relative aspect-video bg-slate-950 overflow-hidden">
                        <img src="${p.img}" class="w-full h-full object-cover group-hover:scale-105 transition-transform duration-500">
                        <span class="absolute top-3 left-3 px-3 py-1 rounded-full bg-slate-950/80 border border-white/10 text-[10px] font-bold text-cyan-300 uppercase">${p.type}</span>
                    </div>
                    <div class="p-6 space-y-3">
                        <span class="text-2xl font-black text-white">$${p.price.toLocaleString()}</span>
                        <h3 class="text-lg font-bold text-white">${p.title}</h3>
                        <p class="text-xs text-slate-400 flex items-center gap-1"><i data-lucide="map-pin" class="w-3.5 h-3.5 text-cyan-400"></i> ${p.location}</p>
                        <div class="grid grid-cols-3 gap-2 pt-4 border-t border-white/10 text-[11px] text-slate-300 font-semibold">
                            <span>🛏️ ${p.beds} Beds</span>
                            <span>🛁 ${p.baths} Baths</span>
                            <span>📐 ${p.area}</span>
                        </div>
                    </div>
                    <div class="p-6 pt-0">
                        <button onclick="alert('Viewing scheduled for ${p.title}. Our luxury agent will contact you.')" class="w-full py-3 rounded-xl bg-white/5 border border-white/10 text-xs font-bold hover:bg-cyan-400 hover:text-slate-950 transition-all">Schedule Private Visit</button>
                    </div>
                </div>
            `).join('');
            lucide.createIcons();
        }

        function toggleMortgageModal() {
            document.getElementById('mortgage-modal').classList.toggle('hidden');
        }

        function computeMortgage() {
            const P = parseFloat(document.getElementById('calc-price').value) * (1 - parseFloat(document.getElementById('calc-down').value)/100);
            const r = (parseFloat(document.getElementById('calc-rate').value)/100) / 12;
            const n = parseInt(document.getElementById('calc-years').value) * 12;
            const monthly = (P * r * Math.pow(1 + r, n)) / (Math.pow(1 + r, n) - 1);
            document.getElementById('calc-result').innerText = '$' + Math.round(monthly).toLocaleString() + ' / mo';
        }

        function filterProperties() {
            const loc = document.getElementById('loc-input').value.toLowerCase();
            const type = document.getElementById('type-select').value;
            const price = document.getElementById('price-select').value;

            const filtered = properties.filter(p => {
                const matchLoc = !loc || p.location.toLowerCase().includes(loc);
                const matchType = type === 'all' || p.type === type;
                const matchPrice = price === 'all' || p.price <= parseInt(price);
                return matchLoc && matchType && matchPrice;
            });
            renderProperties(filtered);
        }

        renderProperties();
    </script>
</body>
</html>
