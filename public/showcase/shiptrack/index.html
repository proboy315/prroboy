<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ShipTrack | Global Logistics & Enterprise Freight Operations</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&family=Fira+Code:wght@400;600&display=swap" rel="stylesheet">
    <script src="https://unpkg.com/lucide@latest"></script>
    <style>
        body { font-family: 'Plus Jakarta Sans', sans-serif; background-color: #080B10; color: #F8FAFC; }
        .font-mono { font-family: 'Fira Code', monospace; }
    </style>
</head>
<body class="bg-slate-950 text-slate-100 antialiased min-h-screen">

    <header class="sticky top-0 z-40 bg-slate-900/90 backdrop-blur-xl border-b border-slate-800">
        <div class="max-w-7xl mx-auto px-6 h-16 flex items-center justify-between">
            <a href="#" class="flex items-center gap-2">
                <div class="w-8 h-8 rounded-xl bg-amber-500 flex items-center justify-center text-slate-950 font-black">ST</div>
                <span class="font-extrabold text-xl tracking-tight text-white">Ship<span class="text-amber-400">Track</span></span>
            </a>

            <div class="flex items-center gap-4 text-xs font-bold">
                <a href="/#projects" class="text-slate-400 hover:text-white flex items-center gap-1">
                    <i data-lucide="arrow-left" class="w-4 h-4"></i> Portfolio
                </a>
            </div>
        </div>
    </header>

    <main class="max-w-7xl mx-auto px-6 py-8 space-y-8">
        
        <div class="grid grid-cols-1 sm:grid-cols-4 gap-4">
            <div class="p-5 rounded-2xl bg-slate-900 border border-slate-800">
                <span class="text-[10px] text-slate-500 uppercase font-mono">Active Shipments</span>
                <span class="text-2xl font-bold text-white block">1,428</span>
            </div>
            <div class="p-5 rounded-2xl bg-slate-900 border border-slate-800">
                <span class="text-[10px] text-slate-500 uppercase font-mono">In Transit</span>
                <span class="text-2xl font-bold text-amber-400 block">892</span>
            </div>
            <div class="p-5 rounded-2xl bg-slate-900 border border-slate-800">
                <span class="text-[10px] text-slate-500 uppercase font-mono">Delivered Today</span>
                <span class="text-2xl font-bold text-emerald-400 block">512</span>
            </div>
            <div class="p-5 rounded-2xl bg-slate-900 border border-slate-800">
                <span class="text-[10px] text-slate-500 uppercase font-mono">Customs Cleared</span>
                <span class="text-2xl font-bold text-cyan-400 block">100%</span>
            </div>
        </div>

        <div class="p-6 rounded-3xl bg-slate-900 border border-slate-800 space-y-6">
            <div class="flex items-center justify-between">
                <h3 class="text-lg font-bold text-white">Container Shipment #ST-99421</h3>
                <span class="px-3 py-1 rounded-full bg-amber-500/10 text-amber-400 border border-amber-500/30 text-xs font-mono font-bold">In Transit to Rotterdam</span>
            </div>

            <div class="grid grid-cols-1 md:grid-cols-4 gap-4 text-xs font-mono">
                <div class="p-3 rounded-xl bg-slate-950 border border-slate-800">
                    <span class="text-slate-500 block">Origin:</span>
                    <strong class="text-white">Port of Singapore</strong>
                </div>
                <div class="p-3 rounded-xl bg-slate-950 border border-slate-800">
                    <span class="text-slate-500 block">Destination:</span>
                    <strong class="text-white">Rotterdam, Netherlands</strong>
                </div>
                <div class="p-3 rounded-xl bg-slate-950 border border-slate-800">
                    <span class="text-slate-500 block">Vessel:</span>
                    <strong class="text-white">Ever Given Pro IV</strong>
                </div>
                <div class="p-3 rounded-xl bg-slate-950 border border-slate-800">
                    <span class="text-slate-500 block">ETA:</span>
                    <strong class="text-emerald-400">Aug 14, 2026</strong>
                </div>
            </div>
        </div>

    </main>

    <script>
        lucide.createIcons();
    </script>
</body>
</html>
