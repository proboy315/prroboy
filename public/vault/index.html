<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Personal Vault — Secure Knowledge Base</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&family=JetBrains+Mono:wght@400;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css">
    <style>
        /* ========== NEUMORPHIC STYLES (same as previous versions) ========== */
        :root {
            --bg: #e0e5ec;
            --text: #2d3748;
            --text-secondary: #718096;
            --light-shadow: #ffffff;
            --dark-shadow: #a3b1c6;
            --accent: #e74c3c;
            --emerald: #2ecc71;
            --cyan: #3498db;
            --card-radius: 28px;
            --input-radius: 16px;
            --btn-radius: 14px;
        }
        * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Inter', -apple-system, sans-serif; -webkit-tap-highlight-color: transparent; }
        body { min-height: 100vh; background: var(--bg); color: var(--text); display: flex; align-items: center; justify-content: center; padding: 16px; overflow-x: hidden; }
        .screen { display: none; width: 100%; max-width: 900px; flex-direction: column; gap: 16px; }
        .screen.active { display: flex; }
        .neu-card { background: var(--bg); border-radius: var(--card-radius); padding: 28px 24px; box-shadow: 14px 14px 28px var(--dark-shadow), -14px -14px 28px var(--light-shadow); }
        .neu-card.inset { box-shadow: inset 6px 6px 14px var(--dark-shadow), inset -6px -6px 14px var(--light-shadow); }
        .neu-input { width: 100%; padding: 14px 16px; border: none; border-radius: var(--input-radius); background: var(--bg); box-shadow: inset 5px 5px 10px var(--dark-shadow), inset -5px -5px 10px var(--light-shadow); font-size: 15px; font-weight: 500; color: var(--text); outline: none; }
        .neu-input:focus { box-shadow: inset 3px 3px 6px var(--dark-shadow), inset -3px -3px 6px var(--light-shadow); }
        .neu-input::placeholder { color: #a0aec0; font-weight: 400; }
        textarea.neu-input { resize: vertical; min-height: 100px; font-family: 'JetBrains Mono', monospace; font-size: 13px; line-height: 1.6; }
        .neu-btn { padding: 12px 22px; border: none; border-radius: var(--btn-radius); background: var(--bg); box-shadow: 5px 5px 12px var(--dark-shadow), -5px -5px 12px var(--light-shadow); font-size: 13px; font-weight: 700; text-transform: uppercase; letter-spacing: 0.8px; cursor: pointer; transition: all 0.2s; display: inline-flex; align-items: center; gap: 7px; color: var(--text); }
        .neu-btn:hover { transform: translateY(-2px); box-shadow: 7px 7px 16px var(--dark-shadow), -7px -7px 16px var(--light-shadow); }
        .neu-btn:active { box-shadow: inset 3px 3px 6px var(--dark-shadow), inset -3px -3px 6px var(--light-shadow); transform: translateY(0); }
        .neu-btn.accent { color: var(--accent); }
        .neu-btn.emerald { color: var(--emerald); }
        .neu-btn.cyan { color: var(--cyan); }
        .neu-btn:disabled { opacity: 0.5; cursor: not-allowed; transform: none !important; }
        .logo-circle { width: 80px; height: 80px; border-radius: 50%; background: var(--bg); box-shadow: inset 5px 5px 12px var(--dark-shadow), inset -5px -5px 12px var(--light-shadow); display: flex; align-items: center; justify-content: center; margin: 0 auto 20px; font-size: 36px; color: var(--text-secondary); transition: all 0.3s; }
        .logo-circle.unlocked { color: var(--emerald); box-shadow: 5px 5px 12px var(--dark-shadow), -5px -5px 12px var(--light-shadow); }
        .auth-title { font-size: 13px; letter-spacing: 2px; color: var(--text-secondary); font-weight: 700; text-transform: uppercase; margin-bottom: 20px; }
        .totp-display { font-family: 'JetBrains Mono', monospace; font-size: 40px; font-weight: 800; letter-spacing: 8px; color: var(--text); padding: 10px; }
        .timer-bar { height: 4px; border-radius: 2px; background: var(--emerald); transition: width 1s linear; margin-top: 8px; width: 100%; }
        .timer-bar.warning { background: var(--accent); }
        #authScreen .auth-card { max-width: 380px; margin: 0 auto; text-align: center; }
        .vault-topbar { display: flex; gap: 10px; align-items: center; flex-wrap: wrap; }
        .vault-topbar .neu-input { flex: 1; min-width: 160px; }
        .vault-layout { display: flex; gap: 14px; flex: 1; min-height: 55vh; max-height: 65vh; }
        @media (max-width: 700px) { .vault-layout { flex-direction: column; max-height: none; } }
        .note-list-panel { flex: 0 0 280px; overflow-y: auto; display: flex; flex-direction: column; gap: 8px; padding-right: 4px; }
        @media (max-width: 700px) { .note-list-panel { flex: 0 0 auto; max-height: 200px; } }
        .note-list-item { padding: 14px 16px; border-radius: var(--input-radius); background: var(--bg); box-shadow: 3px 3px 8px var(--dark-shadow), -3px -3px 8px var(--light-shadow); cursor: pointer; transition: all 0.2s; border-left: 3px solid transparent; }
        .note-list-item:hover { transform: translateX(2px); }
        .note-list-item.active { border-left-color: var(--accent); box-shadow: inset 2px 2px 5px var(--dark-shadow), inset -2px -2px 5px var(--light-shadow); }
        .note-list-item .note-title { font-weight: 700; font-size: 14px; margin-bottom: 4px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
        .note-list-item .note-meta { font-size: 10px; color: var(--text-secondary); display: flex; gap: 8px; }
        .note-list-item .note-tag { background: var(--bg); box-shadow: inset 1px 1px 3px var(--dark-shadow), inset -1px -1px 3px var(--light-shadow); padding: 2px 8px; border-radius: 20px; font-size: 9px; font-weight: 600; color: var(--cyan); }
        .note-content-panel { flex: 1; overflow-y: auto; display: flex; flex-direction: column; gap: 10px; padding: 4px; }
        .empty-state { text-align: center; color: var(--text-secondary); padding: 40px 20px; font-size: 14px; }
        .empty-state i { font-size: 48px; display: block; margin-bottom: 12px; opacity: 0.5; }
        .attachment-chip { display: inline-flex; align-items: center; gap: 6px; padding: 8px 14px; border-radius: 25px; background: var(--bg); box-shadow: 3px 3px 6px var(--dark-shadow), -3px -3px 6px var(--light-shadow); font-size: 11px; font-weight: 600; cursor: pointer; margin: 3px; }
        .attachment-chip i { color: var(--cyan); }
        .modal-overlay { position: fixed; inset: 0; background: rgba(45,55,72,0.55); display: flex; align-items: center; justify-content: center; z-index: 1000; padding: 16px; opacity: 0; pointer-events: none; transition: opacity 0.3s; }
        .modal-overlay.active { opacity: 1; pointer-events: all; }
        .modal-card { background: var(--bg); border-radius: var(--card-radius); padding: 24px 20px; box-shadow: 18px 18px 40px rgba(0,0,0,0.3), -4px -4px 20px var(--light-shadow); width: 100%; max-width: 600px; max-height: 85vh; overflow-y: auto; display: flex; flex-direction: column; gap: 14px; }
        .modal-card h3 { font-size: 16px; letter-spacing: 1px; text-transform: uppercase; }
        #setupScreen .setup-card { max-width: 450px; margin: 0 auto; text-align: center; }
        .setup-card h2 { font-size: 15px; letter-spacing: 1.5px; text-transform: uppercase; margin-bottom: 6px; color: var(--text); }
        .setup-card .hint { font-size: 10px; color: var(--text-secondary); margin-bottom: 16px; line-height: 1.5; }
        .toast { position: fixed; bottom: 30px; left: 50%; transform: translateX(-50%) translateY(80px); background: var(--bg); padding: 12px 24px; border-radius: 30px; box-shadow: 6px 6px 16px var(--dark-shadow), -6px -6px 16px var(--light-shadow); font-weight: 700; font-size: 12px; z-index: 2000; transition: transform 0.35s cubic-bezier(0.175, 0.885, 0.32, 1.275); display: flex; align-items: center; gap: 8px; }
        .toast.show { transform: translateX(-50%) translateY(0); }
        .toast.success { color: var(--emerald); }
        .toast.error { color: var(--accent); }
        ::-webkit-scrollbar { width: 5px; } ::-webkit-scrollbar-track { background: transparent; } ::-webkit-scrollbar-thumb { background: #c4cdd9; border-radius: 10px; }
        @keyframes spin { to { transform: rotate(360deg); } }
        .spinner { animation: spin 0.8s linear infinite; }
    </style>
</head>
<body>
    <!-- ========== SETUP SCREEN ========== -->
    <div class="screen" id="setupScreen">
        <div class="neu-card setup-card">
            <div class="logo-circle"><i class="fas fa-cog"></i></div>
            <h2>⚙️ First-Time Setup</h2>
            <p class="hint">Enter your vault configuration. These are saved only in your browser.</p>
            <input type="text" class="neu-input" id="setupTotpSecret" placeholder="TOTP Secret Key" autocomplete="off">
            <input type="text" class="neu-input" id="setupRepo" placeholder="GitHub Repo (user/repo)" autocomplete="off">
            <input type="password" class="neu-input" id="setupToken" placeholder="GitHub Token" autocomplete="off">
            <input type="text" class="neu-input" id="setupDbPath" placeholder="Database path (default: public/vault/database.json)" value="public/vault/database.json" autocomplete="off">
            <button class="neu-btn accent" id="setupSaveBtn" style="width:100%;justify-content:center;"><i class="fas fa-save"></i> Save & Continue</button>
        </div>
    </div>

    <!-- ========== AUTH SCREEN ========== -->
    <div class="screen" id="authScreen">
        <div class="neu-card auth-card">
            <div class="logo-circle" id="authLogo"><i class="fas fa-lock"></i></div>
            <div class="auth-title">Authenticator Code Required</div>
            <input type="text" class="neu-input totp-display" id="totpInput" placeholder="000000" maxlength="6" autocomplete="off" inputmode="numeric">
            <div class="timer-bar" id="timerBar"></div>
            <p style="font-size:10px;color:var(--text-secondary);margin-top:6px;" id="totpStatus">Enter the 6-digit code from your authenticator app</p>
            <button class="neu-btn accent" id="unlockBtn" style="width:100%;justify-content:center;margin-top:8px;"><i class="fas fa-unlock-alt"></i> Unlock Vault</button>
            <button class="neu-btn" id="resetSetupBtn" style="width:100%;justify-content:center;margin-top:4px;font-size:10px;">Reconfigure Settings</button>
        </div>
    </div>

    <!-- ========== VAULT SCREEN ========== -->
    <div class="screen" id="vaultScreen">
        <div class="vault-topbar">
            <input type="text" class="neu-input" id="searchInput" placeholder="🔍 Search notes...">
            <button class="neu-btn" id="newNoteBtn"><i class="fas fa-plus"></i> New</button>
            <button class="neu-btn" id="lockBtn"><i class="fas fa-lock"></i></button>
            <button class="neu-btn" id="refreshBtn"><i class="fas fa-sync-alt"></i></button>
        </div>
        <div class="vault-layout">
            <div class="note-list-panel neu-card inset" id="noteListPanel"></div>
            <div class="note-content-panel neu-card inset" id="noteContentPanel">
                <div class="empty-state"><i class="fas fa-book-open"></i><p>Select a note or create a new one</p></div>
            </div>
        </div>
    </div>

    <!-- ========== EDIT MODAL ========== -->
    <div class="modal-overlay" id="editModal">
        <div class="modal-card">
            <h3 id="editModalTitle"><i class="fas fa-pen-to-square"></i> Edit Note</h3>
            <input type="text" class="neu-input" id="editTitle" placeholder="Note title..." autocomplete="off">
            <textarea class="neu-input" id="editContent" placeholder="Write your note here..." rows="6"></textarea>
            <div>
                <label style="font-size:10px;font-weight:700;text-transform:uppercase;color:var(--text-secondary);">Tags (comma-separated)</label>
                <input type="text" class="neu-input" id="editTags" placeholder="e.g., driver, important, code" autocomplete="off" style="margin-top:4px;">
            </div>
            <div>
                <label style="font-size:10px;font-weight:700;text-transform:uppercase;color:var(--text-secondary);">Attachments</label>
                <div id="existingAttachments" style="display:flex;flex-wrap:wrap;gap:4px;margin:6px 0;"></div>
                <input type="file" id="fileInput" multiple style="display:none;">
                <button class="neu-btn cyan" type="button" id="attachBtn" style="font-size:10px;"><i class="fas fa-paperclip"></i> Add Files</button>
                <div id="newAttachmentsList" style="font-size:10px;color:var(--text-secondary);margin-top:4px;"></div>
            </div>
            <div style="display:flex;gap:10px;flex-wrap:wrap;">
                <button class="neu-btn emerald" id="saveNoteBtn" style="flex:1;justify-content:center;"><i class="fas fa-check"></i> Save Note</button>
                <button class="neu-btn accent" id="deleteNoteBtn"><i class="fas fa-trash"></i></button>
                <button class="neu-btn" id="cancelEditBtn"><i class="fas fa-times"></i> Cancel</button>
            </div>
        </div>
    </div>

    <div class="toast" id="toastEl"></div>

    <script>
        (() => {
            // DOM elements
            const $ = s => document.querySelector(s);
            const setupScreen = $('#setupScreen'), authScreen = $('#authScreen'), vaultScreen = $('#vaultScreen');
            const setupTotpSecret = $('#setupTotpSecret'), setupRepo = $('#setupRepo'), setupToken = $('#setupToken'), setupDbPath = $('#setupDbPath'), setupSaveBtn = $('#setupSaveBtn');
            const totpInput = $('#totpInput'), unlockBtn = $('#unlockBtn'), timerBar = $('#timerBar'), totpStatus = $('#totpStatus'), authLogo = $('#authLogo'), resetSetupBtn = $('#resetSetupBtn');
            const searchInput = $('#searchInput'), noteListPanel = $('#noteListPanel'), noteContentPanel = $('#noteContentPanel');
            const newNoteBtn = $('#newNoteBtn'), lockBtn = $('#lockBtn'), refreshBtn = $('#refreshBtn');
            const editModal = $('#editModal'), editModalTitle = $('#editModalTitle'), editTitle = $('#editTitle'), editContent = $('#editContent'), editTags = $('#editTags');
            const existingAttachments = $('#existingAttachments'), fileInput = $('#fileInput'), attachBtn = $('#attachBtn'), newAttachmentsList = $('#newAttachmentsList');
            const saveNoteBtn = $('#saveNoteBtn'), deleteNoteBtn = $('#deleteNoteBtn'), cancelEditBtn = $('#cancelEditBtn');
            const toastEl = $('#toastEl');

            let config = { totpSecret: '', repo: '', token: '', dbPath: 'public/vault/database.json' };
            let database = { notes: [] }, dbSha = null, selectedNoteId = null, editingNoteId = null;
            let pendingFiles = [], existingNoteAttachments = [], removedAttachmentIndexes = [];
            let vaultUnlocked = false, totpInterval = null;

            // ---------- TOTP functions ----------
            function base32Decode(secret) {
                const alphabet = 'ABCDEFGHIJKLMNOPQRSTUVWXYZ234567';
                secret = secret.toUpperCase().replace(/[^A-Z2-7]/g, '');
                let bits = '';
                for (let i = 0; i < secret.length; i++) {
                    const val = alphabet.indexOf(secret[i]);
                    if (val === -1) continue;
                    bits += val.toString(2).padStart(5, '0');
                }
                const bytes = [];
                for (let i = 0; i + 8 <= bits.length; i += 8) bytes.push(parseInt(bits.substring(i, i+8), 2));
                return new Uint8Array(bytes);
            }

            async function generateTOTP(secret, timeStep = 30) {
                const keyBytes = base32Decode(secret);
                const counter = Math.floor(Date.now() / 1000 / timeStep);
                const counterBytes = new Uint8Array(8);
                let c = counter;
                for (let i = 7; i >= 0; i--) { counterBytes[i] = c & 0xff; c = Math.floor(c / 256); }
                const hmacKey = await crypto.subtle.importKey('raw', keyBytes, { name: 'HMAC', hash: 'SHA-1' }, false, ['sign']);
                const signature = await crypto.subtle.sign('HMAC', hmacKey, counterBytes);
                const hmacArr = new Uint8Array(signature);
                const offset = hmacArr[19] & 0x0f;
                const binary = ((hmacArr[offset] & 0x7f) << 24) | ((hmacArr[offset+1] & 0xff) << 16) | ((hmacArr[offset+2] & 0xff) << 8) | (hmacArr[offset+3] & 0xff);
                return (binary % 1000000).toString().padStart(6, '0');
            }

            async function verifyTOTP(secret, input) {
                if (!secret || !input) return false;
                const now = Math.floor(Date.now() / 1000);
                for (let offset = -1; offset <= 1; offset++) {
                    const time = now + offset * 30;
                    const keyBytes = base32Decode(secret);
                    const counter = Math.floor(time / 30);
                    const counterBytes = new Uint8Array(8);
                    let c = counter;
                    for (let i = 7; i >= 0; i--) { counterBytes[i] = c & 0xff; c = Math.floor(c / 256); }
                    const hmacKey = await crypto.subtle.importKey('raw', keyBytes, { name: 'HMAC', hash: 'SHA-1' }, false, ['sign']);
                    const signature = await crypto.subtle.sign('HMAC', hmacKey, counterBytes);
                    const arr = new Uint8Array(signature);
                    const off = arr[19] & 0x0f;
                    const bin = ((arr[off] & 0x7f) << 24) | ((arr[off+1] & 0xff) << 16) | ((arr[off+2] & 0xff) << 8) | (arr[off+3] & 0xff);
                    const code = (bin % 1000000).toString().padStart(6, '0');
                    if (code === input) return true;
                }
                return false;
            }

            function getSecondsRemaining() { return 30 - (Math.floor(Date.now() / 1000) % 30); }

            function updateTimerBar() {
                if (vaultUnlocked || !authScreen.classList.contains('active')) return;
                const remaining = getSecondsRemaining();
                timerBar.style.width = (remaining / 30 * 100) + '%';
                timerBar.classList.toggle('warning', remaining <= 8);
            }

            // ---------- GitHub API ----------
            function getApiBase() {
                const [owner, repo] = config.repo.split('/');
                return `https://api.github.com/repos/${owner}/${repo}/contents`;
            }

            async function githubFetch(path, options = {}) {
                const url = `${getApiBase()}/${path}`;
                const headers = { 'Authorization': `token ${config.token}`, 'Accept': 'application/vnd.github.v3+json', ...options.headers };
                const res = await fetch(url, { ...options, headers });
                if (!res.ok) {
                    const err = await res.json().catch(() => ({}));
                    throw new Error(err.message || `GitHub error ${res.status}`);
                }
                return res.json();
            }

            async function loadDatabase() {
                try {
                    const data = await githubFetch(config.dbPath);
                    dbSha = data.sha;
                    const bytes = Uint8Array.from(atob(data.content), c => c.charCodeAt(0));
                    database = JSON.parse(new TextDecoder().decode(bytes));
                    if (!database.notes) database.notes = [];
                } catch (e) {
                    if (e.message.includes('404') || e.message.includes('Not Found')) {
                        database = { version: 1, notes: [] };
                        dbSha = null;
                    } else throw e;
                }
            }

            async function saveDatabase(msg = 'Update vault') {
                const json = JSON.stringify(database, null, 2);
                const bytes = new TextEncoder().encode(json);
                let binary = '';
                bytes.forEach(b => binary += String.fromCharCode(b));
                const contentB64 = btoa(binary);
                const body = { message: msg, content: contentB64 };
                if (dbSha) body.sha = dbSha;
                const result = await githubFetch(config.dbPath, { method: 'PUT', body: JSON.stringify(body), headers: { 'Content-Type': 'application/json' } });
                dbSha = result.content.sha;
            }

            // ---------- Note helpers ----------
            function generateId() { return 'note_' + Date.now() + '_' + Math.random().toString(36).substr(2, 6); }
            function createNote(title, content, tags, attachments) {
                const now = new Date().toISOString();
                return { id: generateId(), title: title || 'Untitled', content: content || '', tags: tags || [], attachments: attachments || [], createdAt: now, updatedAt: now };
            }
            function findNoteIndex(id) { return database.notes.findIndex(n => n.id === id); }

            // ---------- Rendering ----------
            function renderNoteList(filter = '') {
                const q = filter.toLowerCase().trim();
                let notes = database.notes;
                if (q) notes = notes.filter(n => n.title.toLowerCase().includes(q) || n.content.toLowerCase().includes(q) || (n.tags || []).some(t => t.toLowerCase().includes(q)));
                notes.sort((a,b) => new Date(b.updatedAt) - new Date(a.updatedAt));
                if (!notes.length) {
                    noteListPanel.innerHTML = '<p style="text-align:center;color:var(--text-secondary);font-size:11px;padding:20px;">No notes found.</p>';
                    return;
                }
                noteListPanel.innerHTML = notes.map(n => {
                    const tagHtml = (n.tags||[]).slice(0,3).map(t => `<span class="note-tag">${escapeHtml(t)}</span>`).join('');
                    const preview = (n.content||'').substring(0,60).replace(/\n/g, ' ');
                    const date = new Date(n.updatedAt).toLocaleDateString('en-US', {month:'short',day:'numeric',year:'2-digit'});
                    const active = selectedNoteId === n.id ? ' active' : '';
                    return `<div class="note-list-item${active}" data-note-id="${n.id}">
                        <div class="note-title">${escapeHtml(n.title||'Untitled')}</div>
                        <div class="note-meta"><span>${date}</span>${tagHtml}${n.attachments?.length?`<span><i class="fas fa-paperclip"></i> ${n.attachments.length}</span>`:''}</div>
                        ${preview?`<div style="font-size:10px;color:var(--text-secondary);margin-top:3px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;">${escapeHtml(preview)}</div>`:''}
                    </div>`;
                }).join('');
                noteListPanel.querySelectorAll('.note-list-item').forEach(el => el.addEventListener('click', () => selectNote(el.dataset.noteId)));
            }

            function selectNote(id) {
                selectedNoteId = id;
                const note = database.notes.find(n => n.id === id);
                if (!note) { noteContentPanel.innerHTML = '<div class="empty-state"><i class="fas fa-question-circle"></i><p>Note not found</p></div>'; renderNoteList(searchInput.value); return; }
                renderNoteContent(note);
                renderNoteList(searchInput.value);
            }

            function renderNoteContent(note) {
                const tags = (note.tags||[]).map(t => `<span class="note-tag">${escapeHtml(t)}</span>`).join(' ');
                const atts = (note.attachments||[]).map((a,i) => `<span class="attachment-chip" data-att-idx="${i}"><i class="fas fa-paperclip"></i> ${escapeHtml(a.name)} (${formatSize(a.size)})</span>`).join('');
                noteContentPanel.innerHTML = `
                    <div style="display:flex;justify-content:space-between;align-items:flex-start;flex-wrap:wrap;gap:8px;">
                        <h2 style="font-size:20px;font-weight:800;">${escapeHtml(note.title||'Untitled')}</h2>
                        <button class="neu-btn" id="editExistingBtn"><i class="fas fa-edit"></i></button>
                    </div>
                    ${tags?`<div style="display:flex;flex-wrap:wrap;gap:4px;">${tags}</div>`:''}
                    <div style="font-size:10px;color:var(--text-secondary);">Created: ${new Date(note.createdAt).toLocaleString()} · Updated: ${new Date(note.updatedAt).toLocaleString()}</div>
                    <div style="white-space:pre-wrap;line-height:1.7;font-size:14px;word-break:break-word;font-family:'JetBrains Mono',monospace;background:var(--bg);box-shadow:inset 3px 3px 6px var(--dark-shadow),inset -3px -3px 6px var(--light-shadow);border-radius:14px;padding:16px;margin-top:4px;">${escapeHtml(note.content||'')||'<span style="color:var(--text-secondary);">No content</span>'}</div>
                    ${atts?`<div><strong style="font-size:10px;text-transform:uppercase;color:var(--text-secondary);">Attachments</strong><div style="display:flex;flex-wrap:wrap;gap:4px;margin-top:6px;">${atts}</div></div>`:''}
                `;
                $('#editExistingBtn')?.addEventListener('click', () => openEditModal(note.id));
                noteContentPanel.querySelectorAll('.attachment-chip').forEach(chip => {
                    chip.addEventListener('click', () => downloadAttachment(note, parseInt(chip.dataset.attIdx)));
                });
            }

            function downloadAttachment(note, idx) {
                const att = note.attachments[idx];
                if (!att?.data) return showToast('No data', 'error');
                const byteStr = atob(att.data);
                const bytes = new Uint8Array(byteStr.length);
                for (let i = 0; i < byteStr.length; i++) bytes[i] = byteStr.charCodeAt(i);
                const blob = new Blob([bytes], { type: att.type || 'application/octet-stream' });
                const url = URL.createObjectURL(blob);
                const a = document.createElement('a'); a.href = url; a.download = att.name; document.body.appendChild(a); a.click(); document.body.removeChild(a); URL.revokeObjectURL(url);
                showToast(`Downloaded ${att.name}`, 'success');
            }

            function escapeHtml(str) { const d = document.createElement('div'); d.textContent = str; return d.innerHTML; }
            function formatSize(bytes) { if (bytes < 1024) return bytes+' B'; if (bytes < 1048576) return (bytes/1024).toFixed(1)+' KB'; return (bytes/1048576).toFixed(1)+' MB'; }

            // ---------- Modal ----------
            function openEditModal(noteId = null) {
                editingNoteId = noteId;
                pendingFiles = []; removedAttachmentIndexes = []; newAttachmentsList.innerHTML = ''; fileInput.value = '';
                if (noteId) {
                    const note = database.notes.find(n => n.id === noteId);
                    if (!note) return;
                    editModalTitle.innerHTML = '<i class="fas fa-pen-to-square"></i> Edit Note';
                    editTitle.value = note.title || ''; editContent.value = note.content || ''; editTags.value = (note.tags||[]).join(', ');
                    existingNoteAttachments = [...(note.attachments||[])];
                    deleteNoteBtn.style.display = 'inline-flex';
                } else {
                    editModalTitle.innerHTML = '<i class="fas fa-plus-circle"></i> New Note';
                    editTitle.value = ''; editContent.value = ''; editTags.value = '';
                    existingNoteAttachments = []; deleteNoteBtn.style.display = 'none';
                }
                renderExistingAttachments();
                editModal.classList.add('active');
                setTimeout(() => editTitle.focus(), 200);
            }

            function closeEditModal() {
                editModal.classList.remove('active');
                editingNoteId = null; pendingFiles = []; existingNoteAttachments = []; removedAttachmentIndexes = [];
                newAttachmentsList.innerHTML = ''; fileInput.value = '';
            }

            function renderExistingAttachments() {
                existingAttachments.innerHTML = existingNoteAttachments.map((att, idx) => {
                    if (removedAttachmentIndexes.includes(idx)) return '';
                    return `<span class="attachment-chip"> <i class="fas fa-paperclip"></i> ${escapeHtml(att.name)} (${formatSize(att.size)}) <span class="remove-tag" data-remove="${idx}" style="cursor:pointer;color:var(--accent);margin-left:4px;">&times;</span></span>`;
                }).join('');
                existingAttachments.querySelectorAll('.remove-tag').forEach(el => el.addEventListener('click', (e) => {
                    e.stopPropagation();
                    const idx = parseInt(el.dataset.remove);
                    if (!removedAttachmentIndexes.includes(idx)) removedAttachmentIndexes.push(idx);
                    renderExistingAttachments();
                }));
            }

            async function saveNoteFromModal() {
                const title = editTitle.value.trim() || 'Untitled';
                const content = editContent.value;
                const tags = [...new Set(editTags.value.split(',').map(t => t.trim()).filter(Boolean))];
                const newAtts = await Promise.all(pendingFiles.map(file => new Promise(resolve => {
                    const reader = new FileReader();
                    reader.onload = () => resolve({ name: file.name, type: file.type, size: file.size, data: reader.result.split(',')[1] });
                    reader.onerror = () => resolve(null);
                    reader.readAsDataURL(file);
                })));
                const validNew = newAtts.filter(a => a);
                const kept = existingNoteAttachments.filter((_, i) => !removedAttachmentIndexes.includes(i));
                const allAttachments = [...kept, ...validNew];
                if (editingNoteId) {
                    const idx = findNoteIndex(editingNoteId);
                    if (idx >= 0) {
                        database.notes[idx].title = title; database.notes[idx].content = content; database.notes[idx].tags = tags;
                        database.notes[idx].attachments = allAttachments; database.notes[idx].updatedAt = new Date().toISOString();
                    }
                } else {
                    database.notes.unshift(createNote(title, content, tags, allAttachments));
                    selectedNoteId = database.notes[0].id;
                }
                try {
                    await saveDatabase(editingNoteId ? `Update: ${title}` : `Create: ${title}`);
                    closeEditModal(); renderNoteList(searchInput.value); if (selectedNoteId) selectNote(selectedNoteId);
                    showToast('Note saved', 'success');
                } catch (err) { showToast('Save failed: '+err.message, 'error'); try { await loadDatabase(); } catch(e){} renderNoteList(searchInput.value); }
            }

            async function deleteNoteFromModal() {
                if (!editingNoteId || !confirm('Delete this note?')) return;
                database.notes = database.notes.filter(n => n.id !== editingNoteId);
                if (selectedNoteId === editingNoteId) selectedNoteId = null;
                try {
                    await saveDatabase('Delete note');
                    closeEditModal(); renderNoteList(searchInput.value);
                    noteContentPanel.innerHTML = '<div class="empty-state"><i class="fas fa-trash-alt"></i><p>Note deleted</p></div>';
                    showToast('Deleted', 'success');
                } catch (err) { showToast('Delete failed: '+err.message, 'error'); try { await loadDatabase(); } catch(e){} }
            }

            // ---------- Vault lock/unlock ----------
            async function unlockVault() {
                const code = totpInput.value.trim();
                if (!/^\d{6}$/.test(code)) return showToast('Enter 6-digit code', 'error');
                const valid = await verifyTOTP(config.totpSecret, code);
                if (!valid) { showToast('Invalid code', 'error'); totpInput.value = ''; return; }
                vaultUnlocked = true;
                authLogo.classList.add('unlocked'); authLogo.querySelector('i').className = 'fas fa-unlock-alt';
                totpStatus.textContent = '✅ Verified — loading...';
                unlockBtn.disabled = true; totpInput.disabled = true;
                try {
                    await loadDatabase();
                    showScreen(vaultScreen); renderNoteList();
                    noteContentPanel.innerHTML = '<div class="empty-state"><i class="fas fa-book-open"></i><p>Select a note or create new</p></div>';
                    showToast('Vault unlocked', 'success');
                } catch (err) {
                    showToast('Failed to load database: '+err.message, 'error');
                    vaultUnlocked = false; authLogo.classList.remove('unlocked'); authLogo.querySelector('i').className = 'fas fa-lock';
                    totpStatus.textContent = 'Enter the 6-digit code'; unlockBtn.disabled = false; totpInput.disabled = false;
                }
            }

            function lockVault() {
                vaultUnlocked = false; selectedNoteId = null; editingNoteId = null;
                database = { notes: [] }; dbSha = null;
                totpInput.value = ''; totpInput.disabled = false; unlockBtn.disabled = false;
                authLogo.classList.remove('unlocked'); authLogo.querySelector('i').className = 'fas fa-lock';
                totpStatus.textContent = 'Enter the 6-digit code';
                showScreen(authScreen); totpInput.focus();
                showToast('Vault locked', '');
            }

            // ---------- Config loading from API ----------
            async function fetchConfigFromAPI() {
                try {
                    const res = await fetch('/api/config');
                    if (!res.ok) throw new Error('API not reachable');
                    const data = await res.json();
                    if (data.totpSecret && data.repo && data.token) {
                        config = { totpSecret: data.totpSecret, repo: data.repo, token: data.token, dbPath: data.dbPath || 'public/vault/database.json' };
                        localStorage.setItem('vault_config', JSON.stringify(config));
                        return true;
                    }
                } catch (e) { console.warn('Config API not available, using localStorage or manual setup'); }
                return false;
            }

            function loadConfigFromLocalStorage() {
                try {
                    const raw = localStorage.getItem('vault_config');
                    if (raw) { config = JSON.parse(raw); return true; }
                } catch(e) {}
                return false;
            }

            async function initConfig() {
                // First try API (env vars from Vercel)
                const apiSuccess = await fetchConfigFromAPI();
                if (apiSuccess) return true;
                // Then try localStorage
                if (loadConfigFromLocalStorage()) return true;
                // Otherwise show setup
                return false;
            }

            // ---------- Screens ----------
            function showScreen(screen) {
                [setupScreen, authScreen, vaultScreen].forEach(s => s.classList.remove('active'));
                screen.classList.add('active');
            }

            function showToast(msg, type = '') {
                clearTimeout(window.toastTimer);
                toastEl.textContent = msg; toastEl.className = 'toast ' + type + ' show';
                window.toastTimer = setTimeout(() => toastEl.classList.remove('show'), 2800);
            }

            // ---------- Event listeners ----------
            setupSaveBtn.addEventListener('click', () => {
                config.totpSecret = setupTotpSecret.value.trim();
                config.repo = setupRepo.value.trim();
                config.token = setupToken.value.trim();
                config.dbPath = setupDbPath.value.trim() || 'public/vault/database.json';
                if (!config.totpSecret || !config.repo || !config.token) return showToast('All fields required', 'error');
                if (!config.repo.includes('/')) return showToast('Repo format: user/repo', 'error');
                localStorage.setItem('vault_config', JSON.stringify(config));
                showToast('Saved!', 'success');
                showScreen(authScreen); totpInput.focus();
            });

            resetSetupBtn.addEventListener('click', () => {
                if (confirm('Clear saved config and re-enter?')) {
                    localStorage.removeItem('vault_config');
                    config = { totpSecret: '', repo: '', token: '', dbPath: 'public/vault/database.json' };
                    showScreen(setupScreen);
                }
            });

            unlockBtn.addEventListener('click', unlockVault);
            totpInput.addEventListener('keydown', e => { if (e.key === 'Enter') unlockVault(); });

            searchInput.addEventListener('input', () => renderNoteList(searchInput.value));
            newNoteBtn.addEventListener('click', () => openEditModal(null));
            lockBtn.addEventListener('click', lockVault);
            refreshBtn.addEventListener('click', async () => {
                if (!vaultUnlocked) return;
                try { await loadDatabase(); renderNoteList(searchInput.value); if (selectedNoteId) selectNote(selectedNoteId); showToast('Refreshed', 'success'); }
                catch (err) { showToast('Refresh failed: '+err.message, 'error'); }
            });

            cancelEditBtn.addEventListener('click', closeEditModal);
            saveNoteBtn.addEventListener('click', saveNoteFromModal);
            deleteNoteBtn.addEventListener('click', deleteNoteFromModal);
            attachBtn.addEventListener('click', () => fileInput.click());
            fileInput.addEventListener('change', () => {
                Array.from(fileInput.files).forEach(f => { if (!pendingFiles.some(pf => pf.name === f.name && pf.size === f.size)) pendingFiles.push(f); });
                newAttachmentsList.innerHTML = pendingFiles.map(f => `<span style="display:inline-block;margin:2px;padding:4px 10px;border-radius:12px;background:var(--bg);box-shadow:inset 1px 1px 3px var(--dark-shadow),inset -1px -1px 3px var(--light-shadow);font-size:10px;"><i class="fas fa-file"></i> ${escapeHtml(f.name)} (${formatSize(f.size)})</span>`).join('');
                fileInput.value = '';
            });

            editModal.addEventListener('click', e => { if (e.target === editModal) closeEditModal(); });
            document.addEventListener('keydown', e => {
                if (e.key === 'Escape' && editModal.classList.contains('active')) closeEditModal();
                if (e.ctrlKey && e.key === 'n' && vaultUnlocked && !editModal.classList.contains('active')) { e.preventDefault(); openEditModal(null); }
            });

            // ---------- Start ----------
            totpInterval = setInterval(updateTimerBar, 1000);

            (async () => {
                const hasConfig = await initConfig();
                if (hasConfig) {
                    setupTotpSecret.value = config.totpSecret;
                    setupRepo.value = config.repo;
                    setupToken.value = config.token;
                    setupDbPath.value = config.dbPath;
                    showScreen(authScreen);
                    totpInput.focus();
                } else {
                    showScreen(setupScreen);
                    setupTotpSecret.focus();
                }
            })();
        })();
    </script>
</body>
</html>
