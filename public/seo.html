<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>SEO + AEO Expert — Website Optimization Generator</title>
<style>
:root{
  --bg:#07080c; --bg2:#0b0d13; --panel:rgba(255,255,255,.025); --panel2:rgba(255,255,255,.045);
  --border:rgba(255,255,255,.08); --border2:rgba(255,255,255,.15);
  --text:#e9ecf5; --muted:#8b90a0; --muted2:#5f6478;
  --accent:#7c8cff; --accent2:#a855f7; --accent3:#22d3ee;
  --success:#22c55e; --warn:#f59e0b; --error:#ef4444;
  --radius:12px; --radius-sm:8px;
  --grad:linear-gradient(135deg,#7c8cff 0%,#a855f7 55%,#22d3ee 100%);
}
*{box-sizing:border-box}
html,body{margin:0;padding:0}
body{
  background:radial-gradient(1200px 600px at 15% -10%,rgba(124,140,255,.13),transparent 60%),
             radial-gradient(1000px 500px at 100% 0%,rgba(168,85,247,.10),transparent 55%),
             var(--bg);
  color:var(--text);
  font-family:'Inter',-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,sans-serif;
  font-size:14px; line-height:1.55; -webkit-font-smoothing:antialiased;
  min-height:100vh;
}
::selection{background:rgba(124,140,255,.35)}
a{color:var(--accent);text-decoration:none}
a:hover{text-decoration:underline}

#app{display:flex;flex-direction:column;min-height:100vh}
.topbar{
  display:flex;align-items:center;justify-content:space-between;gap:16px;
  padding:14px 24px;border-bottom:1px solid var(--border);
  background:rgba(7,8,12,.72);backdrop-filter:blur(14px);
  position:sticky;top:0;z-index:20;
}
.brand{display:flex;align-items:center;gap:11px;font-weight:650;letter-spacing:-.01em}
.brand-mark{
  width:30px;height:30px;border-radius:9px;background:var(--grad);
  display:grid;place-items:center;font-size:14px;font-weight:800;color:#0b0d13;
  box-shadow:0 6px 18px rgba(124,140,255,.32);
}
.brand small{display:block;font-weight:400;color:var(--muted);font-size:11px;letter-spacing:.02em}
.topbar-actions{display:flex;gap:8px;align-items:center}

.layout{display:grid;grid-template-columns:268px 1fr;flex:1;min-height:0}
@media(max-width:900px){.layout{grid-template-columns:1fr}}

.sidebar{
  border-right:1px solid var(--border);
  background:rgba(9,10,16,.5);
  padding:20px 14px;overflow-y:auto;max-height:calc(100vh - 60px);
  position:sticky;top:60px;
}
@media(max-width:900px){
  .sidebar{position:static;max-height:none;border-right:none;border-bottom:1px solid var(--border);
    display:flex;flex-wrap:wrap;gap:6px;padding:12px}
  .sidebar .step-item{flex:1 1 140px}
}
.sidebar-title{font-size:11px;text-transform:uppercase;letter-spacing:.1em;color:var(--muted2);margin:0 0 12px 10px;font-weight:600}
.step-item{
  display:flex;align-items:center;gap:10px;padding:9px 10px;border-radius:9px;
  cursor:pointer;color:var(--muted);transition:all .15s;font-size:13px;
  border:1px solid transparent;margin-bottom:2px;position:relative;
}
.step-item:hover{background:var(--panel);color:var(--text)}
.step-item.active{background:linear-gradient(90deg,rgba(124,140,255,.14),rgba(168,85,247,.06));
  color:var(--text);border-color:rgba(124,140,255,.28)}
.step-item.done .step-num{background:rgba(34,197,94,.15);color:var(--success);border-color:rgba(34,197,94,.4)}
.step-num{
  flex:0 0 24px;height:24px;border-radius:6px;border:1px solid var(--border2);
  display:grid;place-items:center;font-size:11px;font-weight:600;color:var(--muted);
  background:rgba(255,255,255,.02);transition:all .15s;
}
.step-item.active .step-num{background:rgba(124,140,255,.2);color:#cfd5ff;border-color:rgba(124,140,255,.55)}

.main{padding:32px 40px 80px;max-width:1040px;width:100%}
@media(max-width:900px){.main{padding:20px 16px 60px}}

.step-head{margin-bottom:26px}
.step-kicker{
  display:inline-flex;align-items:center;gap:6px;font-size:11px;font-weight:600;
  letter-spacing:.08em;text-transform:uppercase;color:var(--accent);
  background:rgba(124,140,255,.10);border:1px solid rgba(124,140,255,.25);
  padding:4px 10px;border-radius:99px;margin-bottom:12px;
}
.step-title{font-size:26px;font-weight:680;letter-spacing:-.02em;margin:0 0 6px;line-height:1.2}
.step-desc{color:var(--muted);margin:0;font-size:14px;max-width:760px}

.card{
  background:var(--panel);border:1px solid var(--border);border-radius:var(--radius);
  padding:22px;margin-bottom:18px;backdrop-filter:blur(8px);
}
.card-title{font-size:15px;font-weight:620;margin:0 0 4px;letter-spacing:-.01em;display:flex;align-items:center;gap:8px}
.card-sub{color:var(--muted);font-size:13px;margin:0 0 16px}
.card.accent{background:linear-gradient(135deg,rgba(124,140,255,.06),rgba(168,85,247,.03));border-color:rgba(124,140,255,.18)}
.card.warn{background:linear-gradient(135deg,rgba(245,158,11,.06),rgba(245,158,11,.02));border-color:rgba(245,158,11,.28)}
.card.success{background:linear-gradient(135deg,rgba(34,197,94,.06),rgba(34,197,94,.02));border-color:rgba(34,197,94,.28)}
.card.error{background:linear-gradient(135deg,rgba(239,68,68,.06),rgba(239,68,68,.02));border-color:rgba(239,68,68,.28)}

.grid{display:grid;gap:14px}
.grid.cols-2{grid-template-columns:1fr 1fr}
.grid.cols-3{grid-template-columns:1fr 1fr 1fr}
@media(max-width:720px){.grid.cols-2,.grid.cols-3{grid-template-columns:1fr}}
.field{display:flex;flex-direction:column;gap:6px}
.field label{font-size:12.5px;font-weight:580;color:var(--text);letter-spacing:.005em}
.field .help{font-size:12px;color:var(--muted);line-height:1.5}
.field input[type="text"],.field input[type="url"],.field input[type="email"],
.field input[type="number"],.field textarea,.field select{
  width:100%;padding:10px 12px;border-radius:var(--radius-sm);
  background:rgba(255,255,255,.025);color:var(--text);
  border:1px solid var(--border);font-family:inherit;font-size:13.5px;
  transition:border-color .15s,background .15s;
}
.field textarea{resize:vertical;min-height:74px;line-height:1.55}
.field input:focus,.field textarea:focus,.field select:focus{
  outline:none;border-color:rgba(124,140,255,.55);background:rgba(124,140,255,.04);
  box-shadow:0 0 0 3px rgba(124,140,255,.08);
}
.field input::placeholder,.field textarea::placeholder{color:var(--muted2)}

.chips{display:flex;flex-wrap:wrap;gap:6px;min-height:0}
.chips:empty{display:none}
.chip{
  display:inline-flex;align-items:center;gap:6px;padding:4px 4px 4px 10px;
  background:rgba(124,140,255,.10);border:1px solid rgba(124,140,255,.28);
  border-radius:99px;font-size:12.5px;color:#cfd5ff;font-weight:500;
}
.chip button{
  background:rgba(255,255,255,.06);border:none;color:#cfd5ff;width:18px;height:18px;
  border-radius:50%;cursor:pointer;display:grid;place-items:center;font-size:13px;line-height:1;
  padding:0;
}
.chip button:hover{background:rgba(239,68,68,.3);color:#fff}

.checks{display:grid;grid-template-columns:repeat(auto-fill,minmax(170px,1fr));gap:8px}
.check{
  display:flex;align-items:center;gap:9px;padding:9px 11px;border-radius:var(--radius-sm);
  background:rgba(255,255,255,.02);border:1px solid var(--border);cursor:pointer;
  font-size:13px;color:var(--text);transition:all .15s;user-select:none;
}
.check:hover{background:rgba(255,255,255,.04);border-color:var(--border2)}
.check input{accent-color:var(--accent);cursor:pointer}
.check.checked{background:rgba(124,140,255,.10);border-color:rgba(124,140,255,.45)}

.btn{
  display:inline-flex;align-items:center;gap:7px;padding:9px 16px;border-radius:var(--radius-sm);
  background:rgba(255,255,255,.04);border:1px solid var(--border2);color:var(--text);
  font-family:inherit;font-size:13px;font-weight:560;cursor:pointer;transition:all .15s;
  letter-spacing:.005em;white-space:nowrap;
}
.btn:hover{background:rgba(255,255,255,.07);border-color:rgba(255,255,255,.25)}
.btn.primary{background:var(--grad);color:#0b0d13;border:none;font-weight:650;
  box-shadow:0 6px 20px rgba(124,140,255,.28)}
.btn.primary:hover{filter:brightness(1.08);transform:translateY(-1px)}
.btn.ghost{background:transparent;border-color:var(--border)}
.btn.ghost:hover{background:var(--panel2)}
.btn.danger{color:#fca5a5;border-color:rgba(239,68,68,.35)}
.btn.danger:hover{background:rgba(239,68,68,.10)}
.btn.sm{padding:6px 11px;font-size:12px}
.btn:disabled{opacity:.4;cursor:not-allowed;transform:none!important;filter:none!important}

.footer{
  display:flex;align-items:center;justify-content:space-between;gap:12px;
  padding:14px 40px;border-top:1px solid var(--border);
  background:rgba(7,8,12,.72);backdrop-filter:blur(14px);position:sticky;bottom:0;z-index:15;
}
@media(max-width:900px){.footer{padding:12px 16px}}
.footer-meta{font-size:12px;color:var(--muted)}
.footer-actions{display:flex;gap:8px}

.repeater{margin-top:6px}
.repeater-header{display:flex;align-items:center;justify-content:space-between;margin-bottom:10px}
.repeater-header h4{margin:0;font-size:14px;font-weight:620}
.repeater-item{
  background:rgba(255,255,255,.018);border:1px solid var(--border);border-radius:var(--radius);
  padding:16px;margin-bottom:12px;position:relative;
}
.repeater-item-head{
  display:flex;align-items:center;justify-content:space-between;
  margin:-16px -16px 14px;padding:10px 14px;border-bottom:1px solid var(--border);
  background:rgba(255,255,255,.02);border-radius:var(--radius) var(--radius) 0 0;
}
.repeater-item-head strong{font-size:12.5px;font-weight:600;color:var(--muted)}
.repeater-item-head strong::before{content:'▸ ';color:var(--accent)}

.code-area{
  width:100%;min-height:280px;font-family:'JetBrains Mono','Fira Code',ui-monospace,monospace;
  font-size:12.5px;line-height:1.6;padding:14px;border-radius:var(--radius-sm);
  background:#050609;color:#cbd5e1;border:1px solid var(--border);
  resize:vertical;tab-size:2;
}
.code-area:focus{outline:none;border-color:rgba(124,140,255,.5)}
.code-preview{
  font-family:'JetBrains Mono','Fira Code',ui-monospace,monospace;
  font-size:12px;line-height:1.6;background:#050609;color:#cbd5e1;
  padding:14px;border-radius:var(--radius-sm);border:1px solid var(--border);
  overflow-x:auto;white-space:pre;max-height:420px;overflow-y:auto;
}

.audit-grid{display:grid;grid-template-columns:1fr;gap:8px}
.audit-row{
  display:flex;align-items:center;gap:12px;padding:11px 14px;border-radius:var(--radius-sm);
  background:rgba(255,255,255,.02);border:1px solid var(--border);
}
.audit-row .status{
  flex:0 0 22px;height:22px;border-radius:50%;display:grid;place-items:center;
  font-size:12px;font-weight:700;
}
.status.ok{background:rgba(34,197,94,.16);color:#4ade80;border:1px solid rgba(34,197,94,.4)}
.status.warn{background:rgba(245,158,11,.16);color:#fbbf24;border:1px solid rgba(245,158,11,.4)}
.status.bad{background:rgba(239,68,68,.16);color:#f87171;border:1px solid rgba(239,68,68,.4)}
.audit-row .audit-name{font-weight:560;min-width:170px;font-size:13px}
.audit-row .audit-detail{color:var(--muted);font-size:12.5px;flex:1}

.diff{display:grid;grid-template-columns:1fr 1fr;gap:14px}
@media(max-width:800px){.diff{grid-template-columns:1fr}}
.diff-col{background:rgba(255,255,255,.02);border:1px solid var(--border);border-radius:var(--radius);padding:14px}
.diff-col h5{margin:0 0 10px;font-size:11px;text-transform:uppercase;letter-spacing:.09em;color:var(--muted);font-weight:600}
.diff-col.before{border-color:rgba(239,68,68,.18)}
.diff-col.after{border-color:rgba(34,197,94,.18)}
.diff-item{margin-bottom:12px}
.diff-item .k{font-size:11px;color:var(--muted2);text-transform:uppercase;letter-spacing:.05em;font-weight:600}
.diff-item .v{font-size:13px;color:var(--text);margin-top:3px;word-break:break-word;line-height:1.5}

.toast-wrap{position:fixed;bottom:80px;right:24px;display:flex;flex-direction:column;gap:8px;z-index:100}
.toast{
  background:rgba(16,18,28,.96);border:1px solid var(--border2);color:var(--text);
  padding:11px 15px;border-radius:var(--radius-sm);font-size:13px;
  box-shadow:0 12px 34px rgba(0,0,0,.6);animation:slideIn .22s ease;
  max-width:340px;
}
.toast.success{border-color:rgba(34,197,94,.5)}
.toast.error{border-color:rgba(239,68,68,.5)}
.toast.warn{border-color:rgba(245,158,11,.5)}
@keyframes slideIn{from{opacity:0;transform:translateX(20px)}to{opacity:1;transform:none}}

.pill{
  display:inline-flex;align-items:center;gap:6px;padding:3px 9px;border-radius:99px;
  font-size:11.5px;font-weight:600;letter-spacing:.02em;
  background:rgba(124,140,255,.12);color:#b5bdff;border:1px solid rgba(124,140,255,.3);
}
.pill.warn{background:rgba(245,158,11,.12);color:#fbbf24;border-color:rgba(245,158,11,.3)}
.pill.ok{background:rgba(34,197,94,.12);color:#4ade80;border-color:rgba(34,197,94,.3)}
.pill.err{background:rgba(239,68,68,.12);color:#f87171;border-color:rgba(239,68,68,.3)}
.divider{height:1px;background:var(--border);margin:22px 0}
.kv{display:grid;grid-template-columns:auto 1fr;gap:6px 14px;font-size:13px}
.kv dt{color:var(--muted);font-weight:560}
.kv dd{margin:0;color:var(--text)}
.muted{color:var(--muted)}
.mono{font-family:'JetBrains Mono',ui-monospace,monospace;font-size:12.5px}
.mt-2{margin-top:8px}.mt-3{margin-top:14px}.mt-4{margin-top:22px}
.file-tree{font-family:'JetBrains Mono',ui-monospace,monospace;font-size:13px;line-height:1.9;color:var(--muted)}
.file-tree .f{color:var(--text)}
.file-tree .d{color:#b5bdff;font-weight:600}
.banner{padding:14px 16px;border-radius:var(--radius);margin-bottom:16px;font-size:13px;line-height:1.6}
.banner.info{background:rgba(124,140,255,.08);border:1px solid rgba(124,140,255,.28);color:#cfd5ff}
.banner.warn{background:rgba(245,158,11,.08);border:1px solid rgba(245,158,11,.3);color:#fde68a}
.banner.success{background:rgba(34,197,94,.08);border:1px solid rgba(34,197,94,.3);color:#bbf7d0}
.banner.err{background:rgba(239,68,68,.08);border:1px solid rgba(239,68,68,.3);color:#fecaca}
.banner strong{color:#fff}
ul.tight{margin:6px 0;padding-left:20px}
ul.tight li{margin-bottom:4px;color:var(--muted);font-size:13px}
</style>
</head>
<body>
<div id="app">
  <header class="topbar">
    <div class="brand">
      <div class="brand-mark">S</div>
      <div>
        <div>SEO + AEO Expert</div>
        <small>Website Optimization Generator</small>
      </div>
    </div>
    <div class="topbar-actions">
      <button class="btn ghost sm" id="btn-reset" title="Clear all data">Reset</button>
      <button class="btn ghost sm" id="btn-export-json" title="Export form data">Export</button>
    </div>
  </header>

  <div class="layout">
    <aside class="sidebar" id="sidebar"></aside>
    <main class="main" id="main"></main>
  </div>

  <footer class="footer">
    <div class="footer-meta" id="footer-meta">Step 1 of 17</div>
    <div class="footer-actions">
      <button class="btn ghost" id="btn-back">← Back</button>
      <button class="btn primary" id="btn-next">Next →</button>
    </div>
  </footer>
</div>
<div class="toast-wrap" id="toasts"></div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/jszip/3.10.1/jszip.min.js"></script>
<script>
/* ==========================================================================
   SEO + AEO Expert — Application Logic
   Modular design: state → analyzer → generators → validators → export
   ========================================================================== */

/* ---------- Utilities ---------- */
const $  = (s, r=document) => r.querySelector(s);
const $$ = (s, r=document) => Array.from(r.querySelectorAll(s));
const escapeHtml = (s='') => String(s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const escapeAttr = escapeHtml;
const clone = o => JSON.parse(JSON.stringify(o));

function getPath(obj, path){
  return path.split('.').reduce((o,k)=> (o==null?undefined:o[k]), obj);
}
function setPath(obj, path, val){
  const keys = path.split('.');
  let cur = obj;
  for(let i=0;i<keys.length-1;i++){
    if(typeof cur[keys[i]] !== 'object' || cur[keys[i]] === null) cur[keys[i]] = {};
    cur = cur[keys[i]];
  }
  cur[keys[keys.length-1]] = val;
}
function normalizeUrl(u){
  if(!u) return '';
  u = u.trim();
  if(!/^https?:\/\//i.test(u)) u = 'https://' + u;
  return u.replace(/\/+$/,'') || u;
}
function extractDomain(u){
  try { return new URL(normalizeUrl(u)).hostname.replace(/^www\./,''); }
  catch { return u; }
}
function isValidUrl(u){
  if(!u) return false;
  try { const x = new URL(normalizeUrl(u)); return !!x.hostname && x.hostname.includes('.'); }
  catch { return false; }
}
function truncate(s, n){ s = (s||'').replace(/\s+/g,' ').trim(); return s.length>n ? s.slice(0,n-1).trim()+'…' : s; }
function toast(msg, type='info', ms=3200){
  const el = document.createElement('div');
  el.className = 'toast ' + type;
  el.textContent = msg;
  $('#toasts').appendChild(el);
  setTimeout(()=>{ el.style.opacity='0'; el.style.transform='translateX(20px)'; setTimeout(()=>el.remove(),300); }, ms);
}
function download(filename, content, mime='text/plain'){
  const blob = new Blob([content], {type:mime});
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  a.href = url; a.download = filename; document.body.appendChild(a); a.click();
  setTimeout(()=>{ URL.revokeObjectURL(url); a.remove(); }, 100);
}
async function copy(text){
  try { await navigator.clipboard.writeText(text); toast('Copied to clipboard','success',1800); }
  catch { toast('Copy failed','error'); }
}

/* ---------- Default State ---------- */
const DEFAULT_STATE = {
  _currentStep: 0,
  website: { url:'', type:'personal-portfolio', purpose:'', goal:'' },
  code: { html:'', source:'paste', fileName:'' },
  identity: { searchName:'', confirmed:false, warning:'', suggestions:[] },
  brand: {
    fullName:'', publicName:'', brandName:'', handle:'', title:'',
    shortSummary:'', detailedAbout:''
  },
  expertise: { primaryProfession:'', roles:[], skills:[], technologies:[], platforms:[], areas:'' },
  services: [],
  audience: { types:[], idealClient:'', problems:'', searches:'' },
  location: { country:'', state:'', city:'', serviceArea:'Remote', areasServed:'' },
  unique: {
    uvp:'', specialization:'', experience:'', certifications:'', awards:'',
    achievements:'', majorProjects:'', notableClients:'', industries:'', languages:'', years:''
  },
  projects: [],
  socials: {
    github:'', linkedin:'', instagram:'', facebook:'', x:'', youtube:'',
    tiktok:'', behance:'', dribbble:'', shopify:'', other:''
  },
  seoContext: {
    mainTopic:'', primary:[], secondary:[], servicesFind:[], locationSearches:[],
    industries:[], problems:[], questions:[], competitors:[]
  },
  seoUnderstand: { google:'', customers:'', questions:'', different:'', topics:'', avoid:'' },
  aeo: { who:'', what:'', services:'', where:'', withWhom:'', tech:'', specialties:'', different:'' },
  faqs: [],
  verification: { method:'meta', metaValue:'', fileName:'', dnsValue:'', fileContent:'' },
  sitemapUrls: [],
  generated: {}
};

/* ---------- Persistence ---------- */
const STORAGE_KEY = 'seo-aeo-expert-v1';
let state = loadState();
let currentStep = state._currentStep || 0;

function loadState(){
  try {
    const raw = localStorage.getItem(STORAGE_KEY);
    if(!raw) return clone(DEFAULT_STATE);
    const parsed = JSON.parse(raw);
    return deepMerge(clone(DEFAULT_STATE), parsed);
  } catch { return clone(DEFAULT_STATE); }
}
function deepMerge(base, ext){
  for(const k in ext){
    if(ext[k] && typeof ext[k] === 'object' && !Array.isArray(ext[k]) && base[k] && typeof base[k]==='object'){
      deepMerge(base[k], ext[k]);
    } else if(ext[k] !== undefined){
      base[k] = ext[k];
    }
  }
  return base;
}
function saveState(){
  state._currentStep = currentStep;
  try { localStorage.setItem(STORAGE_KEY, JSON.stringify(state)); } catch(e){}
}

/* ==========================================================================
   STEPS CONFIG
   ========================================================================== */
const STEPS = [
  { id:'website',      label:'Website',             num:'01' },
  { id:'code',         label:'Existing Code',       num:'02' },
  { id:'identity',     label:'Search Identity',     num:'03' },
  { id:'brand',        label:'Personal / Brand',    num:'04' },
  { id:'expertise',    label:'Expertise',           num:'05' },
  { id:'services',     label:'Services',            num:'06' },
  { id:'audience',     label:'Audience',            num:'07' },
  { id:'location',     label:'Location',            num:'08' },
  { id:'projects',     label:'Projects',            num:'09' },
  { id:'socials',      label:'Social Profiles',     num:'10' },
  { id:'seoContext',   label:'SEO Context',         num:'11' },
  { id:'aeo',          label:'AEO Context',         num:'12' },

function field(label, path, opts={}){
  const { type='text', placeholder='', help='', rows=4 } = opts;
  const val = getPath(state, path);
  const v = val == null ? '' : val;
  const id = 'f-' + path.replace(/\./g,'-');
  if(type === 'textarea'){
    return `<div class="field"><label for="${id}">${label}</label>
      <textarea id="${id}" data-field="${path}" rows="${rows}" placeholder="${escapeAttr(placeholder)}">${escapeHtml(v)}</textarea>
      ${help?`<div class="help">${help}</div>`:''}</div>`;
  }
  if(type === 'select'){
    const opts2 = opts.options.map(o => {
      const value = typeof o === 'string' ? o : o.value;
      const lbl   = typeof o === 'string' ? o : o.label;
      return `<option value="${escapeAttr(value)}" ${v===value?'selected':''}>${escapeHtml(lbl)}</option>`;
    }).join('');
    return `<div class="field"><label for="${id}">${label}</label>
      <select id="${id}" data-field="${path}">${opts2}</select>
      ${help?`<div class="help">${help}</div>`:''}</div>`;
  }
  return `<div class="field"><label for="${id}">${label}</label>
    <input id="${id}" type="${type}" data-field="${path}" value="${escapeAttr(v)}" placeholder="${escapeAttr(placeholder)}">
    ${help?`<div class="help">${help}</div>`:''}</div>`;
}

function listField(label, path, placeholder='Type and press Enter', help=''){
  const arr = getPath(state, path) || [];
  return `<div class="field">
    <label>${label}</label>
    <div class="chips" data-chips="${path}">
      ${arr.map((v,i)=>`<span class="chip">${escapeHtml(v)}<button type="button" data-remove-chip="${path}" data-idx="${i}" aria-label="Remove">×</button></span>`).join('')}
    </div>
    <input type="text" data-chip-input="${path}" placeholder="${escapeAttr(placeholder)}">
    ${help?`<div class="help">${help}</div>`:''}
  </div>`;
}

function checkGroup(label, path, options, help=''){
  const arr = getPath(state, path) || [];
  return `<div class="field">
    <label>${label}</label>
    <div class="checks">
      ${options.map(o=>{
        const checked = arr.includes(o);
        return `<label class="check ${checked?'checked':''}">
          <input type="checkbox" data-check="${path}" value="${escapeAttr(o)}" ${checked?'checked':''}>
          <span>${escapeHtml(o)}</span>
        </label>`;
      }).join('')}
    </div>
    ${help?`<div class="help">${help}</div>`:''}
  </div>`;
}

function repeater(path, title, itemTitleFn, fields, addLabel='+ Add item'){
  const arr = getPath(state, path) || [];
  return `<div class="repeater">
    <div class="repeater-header">
      <h4>${title}</h4>
      <button type="button" class="btn sm" data-add-item="${path}">${addLabel}</button>
    </div>
    ${arr.length===0 ? `<div class="muted" style="font-size:13px;padding:8px 0">No items yet.</div>` : ''}
    ${arr.map((item,i)=>`
      <div class="repeater-item">
        <div class="repeater-item-head">
          <strong>${escapeHtml(itemTitleFn(item, i))}</strong>
          <button type="button" class="btn sm danger" data-remove-item="${path}" data-idx="${i}">Remove</button>
        </div>
        <div class="grid cols-2">
          ${fields.map(f=>field(f.label, `${path}.${i}.${f.key}`, f)).join('')}
        </div>
      </div>
    `).join('')}
  </div>`;
}

function analyzeIdentity(searchName, s){
  const clean = (searchName||'').trim();
  const warnings = [];
  const suggestions = [];
  if(!clean){ return { warning:'', suggestions:[] }; }

  const lower = clean.toLowerCase();
  const tokens = lower.split(/[\s|—\-–_.,&/]+/).filter(Boolean);
  const wordCount = tokens.length;
  const charLen = lower.length;
  const hasBroad = tokens.some(t => BROAD_TERMS.has(t));
  const singleGeneric = wordCount === 1;

  if(singleGeneric && (hasBroad || charLen < 8)){
    warnings.push('This identity is very broad and may overlap with many unrelated people, businesses, and entities. Consider adding a genuine distinguishing element such as your surname, professional identity, brand name, or another authentic identifier.');
  } else if(hasBroad && wordCount <= 2 && charLen < 16){
    warnings.push('This identity contains a common term that may overlap with many unrelated entities. Consider making it more distinctive while keeping it authentic.');
  }
  if(charLen < 5){
    warnings.push('The identity is very short. Shorter names are harder for search systems to associate with a specific entity.');
  }

  const fullName = (s.brand.fullName||'').trim();
  const brandName = (s.brand.brandName||'').trim();
  const handle = (s.brand.handle||'').trim();
  const title = (s.brand.title||'').trim();
  const primary = (s.expertise.primaryProfession||'').trim();

  const push = (v)=>{ if(v && !suggestions.includes(v) && v.toLowerCase() !== lower) suggestions.push(v); };
  if(fullName) push(fullName);
  if(fullName && primary) push(`${fullName} ${primary}`);
  if(fullName && primary) push(`${fullName} | ${primary}`);
  if(fullName && title && title !== primary) push(`${fullName} | ${title}`);
  if(brandName) push(brandName);
  if(fullName && brandName) push(`${fullName} — ${brandName}`);
  if(handle && fullName) push(`${fullName} (${handle})`);

  return { warning: warnings.join(' '), suggestions: suggestions.slice(0,6) };
}

function genTitle(s){
  const identity = (s.identity.searchName||'').trim() || (s.brand.publicName||'').trim() || (s.brand.fullName||'').trim() || (s.brand.brandName||'').trim();
  const prof = (s.expertise.primaryProfession||'').trim() || (s.brand.title||'').trim();
  if(identity && prof) return truncate(`${identity} | ${prof}`, 65);
  if(identity) return truncate(identity, 65);
  if(s.website.url) return truncate(extractDomain(s.website.url), 65);
  return 'My Website';
}

function genDescription(s){
  let base = (s.brand.shortSummary||'').trim();
  if(!base){
    const who = (s.identity.searchName||s.brand.fullName||s.brand.brandName||'').trim();
    const prof = (s.expertise.primaryProfession||s.brand.title||'').trim();
    const loc = [s.location.city, s.location.country].filter(Boolean).join(', ');
    const parts = [];
    if(who && prof) parts.push(`${who} is a ${prof.toLowerCase()}`);
    else if(who) parts.push(who);
    else if(prof) parts.push(prof);
    if(loc) parts.push(`based in ${loc}`);
    base = parts.join(' ') + '.';
    if(s.services.length) base += ` Offers ${s.services.slice(0,3).map(x=>x.name).filter(Boolean).join(', ')}.`;
  }
  base = base.replace(/\s+/g,' ').trim();
  if(base.length > 158) base = truncate(base, 158);
  return base;
}

function genOpenGraph(s, g){
  const url = s.website.url ? normalizeUrl(s.website.url) : '';
  const siteName = (s.brand.brandName || s.identity.searchName || s.brand.fullName || '').trim() || (url ? extractDomain(url) : '');

function genJSONLD(s, g){
  const url = s.website.url ? normalizeUrl(s.website.url) : '';
  const identity = (s.identity.searchName||s.brand.publicName||s.brand.fullName||s.brand.brandName||'').trim();
  const prof = (s.expertise.primaryProfession||s.brand.title||'').trim();
  const sameAs = Object.values(s.socials).filter(v => v && isValidUrl(v));
  const knowsAbout = [
    ...(s.expertise.skills||[]),
    ...(s.expertise.areas ? [s.expertise.areas] : []),
    ...(s.services||[]).map(x=>x.name).filter(Boolean)
  ].slice(0, 20);
  const address = {};
  if(s.location.city) address.addressLocality = s.location.city;
  if(s.location.state) address.addressRegion = s.location.state;
  if(s.location.country) address.addressCountry = s.location.country;

  const graph = [];
  const type = s.website.type;

  const isPersonal = ['personal-portfolio','developer-portfolio','blog','service-website'].includes(type);
  const isOrg = ['business','agency','e-commerce','other'].includes(type);

  if(isPersonal && (identity || prof)){
    const person = {
      '@type': 'Person',
      '@id': (url?url:'') + '#person',
      name: s.brand.fullName || identity,
      url: url || undefined,
      jobTitle: prof || undefined,
      description: (s.brand.shortSummary||'').slice(0,300) || undefined,
      knowsAbout: knowsAbout.length ? knowsAbout : undefined,
      sameAs: sameAs.length ? sameAs : undefined
    };
    if(s.brand.publicName && s.brand.publicName !== person.name) person.alternateName = s.brand.publicName;
    if(Object.keys(address).length) person.address = { '@type':'PostalAddress', ...address };
    if(s.unique.years) person.knowsLanguage = s.unique.languages ? s.unique.languages.split(',').map(x=>x.trim()).filter(Boolean) : undefined;
    Object.keys(person).forEach(k=>person[k]===undefined && delete person[k]);
    graph.push(person);
  }

  if(isOrg || s.brand.brandName){
    const orgName = s.brand.brandName || s.brand.fullName || identity;
    const org = {
      '@type': type === 'e-commerce' ? 'OnlineStore' : (type === 'agency' || type === 'business') ? 'ProfessionalService' : 'Organization',
      '@id': (url?url:'') + '#organization',
      name: orgName,
      url: url || undefined,
      description: (s.brand.shortSummary||'').slice(0,300) || undefined,
      sameAs: sameAs.length ? sameAs : undefined,
      knowsAbout: knowsAbout.length ? knowsAbout : undefined
    };
    if(Object.keys(address).length) org.address = { '@type':'PostalAddress', ...address };
    if(s.location.serviceArea) org.areaServed = s.location.serviceArea;
    if(s.location.areasServed) org.areaServed = s.location.areasServed;
    if(s.brand.handle) org.alternateName = s.brand.handle;
    Object.keys(org).forEach(k=>org[k]===undefined && delete org[k]);
    graph.push(org);
  }

  if(url){
    const ws = {
      '@type': 'WebSite',
      '@id': url + '#website',
      url: url,
      name: s.brand.brandName || s.identity.searchName || s.brand.fullName || extractDomain(url),
      description: g.description || undefined,
      inLanguage: 'en'
    };
    Object.keys(ws).forEach(k=>ws[k]===undefined && delete ws[k]);
    graph.push(ws);

    graph.push({
      '@type': 'WebPage',
      '@id': url + '#webpage',
      url: url,
      name: g.title,
      description: g.description || undefined,
      isPartOf: { '@id': url + '#website' },
      inLanguage: 'en'
    });
  }

  (s.services||[]).forEach((svc, i) => {
    if(!svc.name) return;
    graph.push({
      '@type': 'Service',
      '@id': url ? `${url}#service-${i+1}` : undefined,
      name: svc.name,
      description: (svc.shortDescription || svc.detailedDescription || '').slice(0,300) || undefined,
      provider: url ? { '@id': url + (isOrg || s.brand.brandName ? '#organization' : '#person') } : undefined
    });
  });

  (s.projects||[]).forEach((p, i) => {
    if(!p.name) return;
    graph.push({
      '@type': 'CreativeWork',
      '@id': (p.url || (url ? url + '#project-' + (i+1) : '')),
      name: p.name,
      description: (p.description||'').slice(0,300) || undefined,
      url: p.url || undefined,
      creator: url ? { '@id': url + (isOrg || s.brand.brandName ? '#organization' : '#person') } : undefined
    });
  });

  if((s.faqs||[]).length){
    const mainEntity = s.faqs
      .filter(f => f.question && f.answer)
      .map(f => ({
        '@type': 'Question',
        name: f.question,
        acceptedAnswer: { '@type': 'Answer', text: f.answer }
      }));
    if(mainEntity.length){
      graph.push({
        '@type': 'FAQPage',
        mainEntity
      });
    }
  }

  const clean = (o) => {
    if(Array.isArray(o)) return o.map(clean).filter(x => x !== undefined && x !== null);
    if(o && typeof o === 'object'){
      const out = {};
      for(const k in o){
        const v = clean(o[k]);
        if(v !== undefined && v !== null && !(Array.isArray(v) && v.length===0)) out[k] = v;
      }
      return out;
    }
    return o === undefined ? undefined : o;
  };

  return {
    '@context': 'https://schema.org',
    '@graph': graph.map(clean)
  };
}

function genSitemap(s){
  const urls = [];
  const base = s.website.url ? normalizeUrl(s.website.url) : '';
  if(base) urls.push({ loc: base + '/', priority: '1.0', changefreq: 'weekly' });
  (s.sitemapUrls||[]).forEach(u => {
    if(!u.url) return;
    let loc = u.url.trim();
    if(!/^https?:\/\//i.test(loc)) loc = base + (loc.startsWith('/') ? loc : '/' + loc);
    urls.push({ loc, priority: u.priority || '', changefreq: u.changefreq || '' });
  });
  const seen = new Set();
  const unique = urls.filter(u => { if(seen.has(u.loc)) return false; seen.add(u.loc); return true; });
  const today = new Date().toISOString().split('T')[0];
  const body = unique.map(u => {
    const parts = [`    <loc>${escapeHtml(u.loc)}</loc>`];
    if(u.changefreq) parts.push(`    <changefreq>${escapeHtml(u.changefreq)}</changefreq>`);
    if(u.priority) parts.push(`    <priority>${escapeHtml(u.priority)}</priority>`);
    parts.push(`    <lastmod>${today}</lastmod>`);
    return `  <url>\n${parts.join('\n')}\n  </url>`;
  }).join('\n');
  return `<?xml version="1.0" encoding="UTF-8"?>\n<urlset xmlns="http://www.sitemaps.org/schemas/sitemap/0.9">\n${body}\n</urlset>`;
}

User-agent: *
Allow: /

# Block admin / private areas (uncomment if needed)

Sitemap: ${base}/sitemap.xml
`;

/* ==========================================================================
   HTML INJECTION (preserves existing content)
   ========================================================================== */
function injectSEOIntoHtml(html, g, s){
  if(!html || !html.trim()) return { html:'', changes:[] };
  const changes = [];
  const parser = new DOMParser();
  const doc = parser.parseFromString(html, 'text/html');

  let head = doc.querySelector('head');
  if(!head){
    head = doc.createElement('head');
    doc.documentElement.insertBefore(head, doc.documentElement.firstChild);
    changes.push('Created missing head element.');
  }

  let titleEl = head.querySelector('title');
  if(!titleEl){
    titleEl = doc.createElement('title');
    head.appendChild(titleEl);
    changes.push('Added title tag.');
  } else {
    changes.push(`Updated title: "${truncate(titleEl.textContent,50)}" → "${truncate(g.title,50)}"`);
  }
  titleEl.textContent = g.title;

  function setMeta(attr, key, content){
    if(content === undefined || content === null || content === '') return;
    let el = head.querySelector(`meta[${attr}="${CSS.escape(key)}"]`);
    if(!el){
      el = doc.createElement('meta');
      el.setAttribute(attr, key);
      head.appendChild(el);
      changes.push(`Added meta ${attr}="${key}"`);
    } else {
      changes.push(`Updated meta ${attr}="${key}"`);
    }
    el.setAttribute('content', content);
  }

  if(g.description) setMeta('name', 'description', g.description);

  if(g.canonical){
    let link = head.querySelector('link[rel="canonical"]');
    if(!link){
      link = doc.createElement('link');
      link.setAttribute('rel','canonical');
      head.appendChild(link);
      changes.push('Added link rel=canonical.');
    } else {
      changes.push(`Updated canonical: ${link.getAttribute('href')} → ${g.canonical}`);
    }
    link.setAttribute('href', g.canonical);
  }

  setMeta('name','robots', g.robots);
  const author = s.brand.fullName || s.identity.searchName || s.brand.brandName;
  if(author) setMeta('name','author', author);
  let vp = head.querySelector('meta[name="viewport"]');
  if(!vp){
    vp = doc.createElement('meta');
    vp.setAttribute('name','viewport');
    vp.setAttribute('content','width=device-width, initial-scale=1');
    head.appendChild(vp);
    changes.push('Added viewport meta.');
  }
  setMeta('name','theme-color', '#0a0b0f');

  Object.entries(g.og).forEach(([k,v]) => setMeta('property', k, v));
  Object.entries(g.twitter).forEach(([k,v]) => setMeta('name', k, v));

  const oldLD = head.querySelectorAll('script[type="application/ld+json"]');
  if(oldLD.length){
    oldLD.forEach(x => x.remove());
    changes.push(`Replaced ${oldLD.length} existing JSON-LD block(s).`);
  }
  const ld = doc.createElement('script');
  ld.setAttribute('type','application/ld+json');
  ld.textContent = '\n' + JSON.stringify(g.jsonld, null, 2) + '\n';
  head.appendChild(ld);
  changes.push('Injected JSON-LD structured data.');

  if(s.verification.method === 'meta' && s.verification.metaValue){
    setMeta('name','google-site-verification', s.verification.metaValue);
    changes.push('Injected Google Search Console verification meta tag.');
  }

  if(!doc.documentElement.getAttribute('lang')){
    doc.documentElement.setAttribute('lang','en');
    changes.push('Added lang="en" to html element.');
  }

  const out = '<!DOCTYPE html>\n' + doc.documentElement.outerHTML;
  return { html: out, changes };
}

/* ==========================================================================
   SEO AUDIT
   ========================================================================== */
function auditHtml(html){
  const results = [];
  if(!html || !html.trim()){
    return { results: [], empty: true };
  }
  const doc = new DOMParser().parseFromString(html, 'text/html');
  const head = doc.querySelector('head') || doc.documentElement;

  const title = head.querySelector('title');
  if(title && title.textContent.trim()){
    const len = title.textContent.trim().length;
    if(len >= 30 && len <= 65) results.push({ name:'Title', status:'ok', detail:`Present (${len} chars) — good length.` });
    else if(len < 30) results.push({ name:'Title', status:'warn', detail:`Present but short (${len} chars). Aim for 30–65.` });
    else results.push({ name:'Title', status:'warn', detail:`Present but long (${len} chars). Aim for 30–65.` });
  } else {
    results.push({ name:'Title', status:'bad', detail:'Missing title tag. This is critical.' });
  }

  const desc = head.querySelector('meta[name="description"]');
  if(desc && desc.getAttribute('content')){
    const len = desc.getAttribute('content').length;
    if(len >= 120 && len <= 160) results.push({ name:'Meta Description', status:'ok', detail:`Present (${len} chars).` });
    else results.push({ name:'Meta Description', status:'warn', detail:`Present but ${len<120?'short':'long'} (${len} chars). Aim for 120–160.` });
  } else {
    results.push({ name:'Meta Description', status:'bad', detail:'Missing meta description.' });
  }

  const canon = head.querySelector('link[rel="canonical"]');
  if(canon && canon.getAttribute('href')) results.push({ name:'Canonical URL', status:'ok', detail:`Present: ${canon.getAttribute('href')}` });
  else results.push({ name:'Canonical URL', status:'bad', detail:'Missing canonical link.' });

  const robotsMeta = head.querySelector('meta[name="robots"]');
  if(robotsMeta){
    const c = (robotsMeta.getAttribute('content')||'').toLowerCase();
    if(c.includes('noindex')) results.push({ name:'Robots Meta', status:'warn', detail:`Contains "noindex" — site may be blocked from indexing: "${c}".` });
    else results.push({ name:'Robots Meta', status:'ok', detail:`Present: "${c}".` });
  } else {
    results.push({ name:'Robots Meta', status:'warn', detail:'Not specified. Defaults to index,follow.' });
  }

  const og = head.querySelectorAll('meta[property^="og:"]');
  if(og.length >= 4) results.push({ name:'Open Graph', status:'ok', detail:`${og.length} og: tags found.` });
  else if(og.length) results.push({ name:'Open Graph', status:'warn', detail:`Only ${og.length} og: tag(s). Recommended: og:title, og:description, og:url, og:type, og:image.` });
  else results.push({ name:'Open Graph', status:'bad', detail:'No Open Graph tags found.' });

  const tw = head.querySelectorAll('meta[name^="twitter:"]');
  if(tw.length >= 3) results.push({ name:'Twitter/X Cards', status:'ok', detail:`${tw.length} twitter: tags found.` });
  else if(tw.length) results.push({ name:'Twitter/X Cards', status:'warn', detail:`Only ${tw.length} twitter: tag(s).` });
  else results.push({ name:'Twitter/X Cards', status:'bad', detail:'No Twitter card tags found.' });

  const ld = head.querySelectorAll('script[type="application/ld+json"]');
  if(ld.length){
    let valid = true;
    ld.forEach(x => { try { JSON.parse(x.textContent); } catch { valid = false; } });
    if(valid) results.push({ name:'Structured Data', status:'ok', detail:`${ld.length} valid JSON-LD block(s).` });
    else results.push({ name:'Structured Data', status:'warn', detail:`${ld.length} JSON-LD block(s) found but at least one has malformed JSON.` });
  } else {
    results.push({ name:'Structured Data', status:'bad', detail:'No JSON-LD structured data found.' });
  }

  results.push({ name:'Sitemap', status:'warn', detail:'Cannot be verified from index.html alone. Ensure /sitemap.xml exists at your domain root.' });
  results.push({ name:'Robots.txt', status:'warn', detail:'Cannot be verified from index.html alone. Ensure /robots.txt exists at your domain root.' });

  const h1 = doc.querySelectorAll('h1');
  if(h1.length === 1) results.push({ name:'Heading Structure', status:'ok', detail:'Exactly one h1 found.' });
  else if(h1.length === 0) results.push({ name:'Heading Structure', status:'bad', detail:'No h1 found.' });
  else results.push({ name:'Heading Structure', status:'warn', detail:`${h1.length} h1 tags found. Recommended: exactly one.` });

  const imgs = doc.querySelectorAll('img');
  if(imgs.length === 0) results.push({ name:'Image Alt Text', status:'warn', detail:'No images found.' });
  else {
    const missing = Array.from(imgs).filter(i => !i.getAttribute('alt')).length;
    if(missing === 0) results.push({ name:'Image Alt Text', status:'ok', detail:`All ${imgs.length} image(s) have alt text.` });
    else results.push({ name:'Image Alt Text', status:'warn', detail:`${missing} of ${imgs.length} image(s) missing alt text.` });
  }

  const vp = head.querySelector('meta[name="viewport"]');
  if(vp && /width=device-width/i.test(vp.getAttribute('content')||'')) results.push({ name:'Viewport', status:'ok', detail:'Responsive viewport configured.' });
  else if(vp) results.push({ name:'Viewport', status:'warn', detail:`Viewport present but may not be responsive: "${vp.getAttribute('content')}"` });
  else results.push({ name:'Viewport', status:'bad', detail:'Missing viewport meta tag.' });

  const lang = doc.documentElement.getAttribute('lang');
  if(lang) results.push({ name:'Language', status:'ok', detail:`lang="${lang}"` });
  else results.push({ name:'Language', status:'warn', detail:'Missing lang attribute on html element.' });

  return { results, empty: false };
}

/* ==========================================================================
   VALIDATION
   ========================================================================== */
function runValidation(s, g){
  const issues = [];
  const warnings = [];

  if(!s.website.url) issues.push('Website URL is missing.');
  else if(!isValidUrl(s.website.url)) issues.push('Website URL is not a valid URL.');

  if(!s.identity.searchName && !s.brand.fullName && !s.brand.brandName)
    warnings.push('No search identity or name provided. The generated title may be generic.');

  if(!g.title) issues.push('Title is empty.');
  else if(g.title.length > 70) warnings.push(`Title is ${g.title.length} chars (recommended ≤ 65).`);
  else if(g.title.length < 15) warnings.push('Title is very short.');

  if(!g.description) warnings.push('Meta description is empty.');
  else if(g.description.length > 165) warnings.push(`Description is ${g.description.length} chars (recommended ≤ 160).`);

  if(!g.canonical) warnings.push('Canonical URL missing.');

  try { JSON.parse(JSON.stringify(g.jsonld)); } catch { issues.push('JSON-LD could not be serialized.'); }

  try {
    const parser = new DOMParser();
    const xml = parser.parseFromString(g.sitemap, 'application/xml');
    if(xml.querySelector('parsererror')) issues.push('Sitemap XML is malformed.');
  } catch { issues.push('Sitemap XML could not be parsed.'); }

  if(!g.robotsTxt || !g.robotsTxt.includes('User-agent')) warnings.push('Robots.txt looks unusual.');

  if(g.injectedHtml){
    if(/<meta[^>]+name=["']robots["'][^>]+noindex/i.test(g.injectedHtml))
      issues.push('Injected HTML contains "noindex" in robots meta — your site would be blocked from indexing!');
  }

  if(g.injectedHtml){
    const doc = new DOMParser().parseFromString(g.injectedHtml, 'text/html');
    const titles = doc.querySelectorAll('title');
    if(titles.length > 1) issues.push(`Multiple title tags found (${titles.length}).`);
    const descs = doc.querySelectorAll('meta[name="description"]');
    if(descs.length > 1) issues.push(`Multiple meta descriptions found (${descs.length}).`);
    const canons = doc.querySelectorAll('link[rel="canonical"]');
    if(canons.length > 1) issues.push(`Multiple canonical links found (${canons.length}).`);
  }

  if(s.verification.method === 'meta' && s.verification.metaValue){
    if(!/^[A-Za-z0-9_\-]{20,}$/.test(s.verification.metaValue.trim()))
      warnings.push('Google verification meta value format looks unusual (usually a long token).');
  }

  if(g.canonical && s.website.url){
    const canDomain = extractDomain(g.canonical);
    const siteDomain = extractDomain(s.website.url);
    if(canDomain && siteDomain && canDomain !== siteDomain)
      issues.push(`Canonical domain (${canDomain}) does not match website domain (${siteDomain}).`);
  }

  return { issues, warnings };
}

/* ==========================================================================
   GENERATE ALL
   ========================================================================== */
function generateAll(){
  const s = state;
  const g = {};
  g.title = s.generated.title || genTitle(s);
  g.description = s.generated.description || genDescription(s);
  g.canonical = s.website.url ? normalizeUrl(s.website.url) + '/' : '';
  g.robots = 'index, follow, max-image-preview:large, max-snippet:-1, max-video-preview:-1';
  g.og = genOpenGraph(s, g);
  g.twitter = genTwitter(s, g);
  g.jsonld = genJSONLD(s, g);
  g.sitemap = genSitemap(s);
  g.robotsTxt = genRobotsTxt(s);
  g.llms = genLlms(s, g);
  const audit = auditHtml(s.code.html);
  g.audit = audit;
  let injected = { html:'', changes:[] };
  if(s.code.html){
    injected = injectSEOIntoHtml(s.code.html, g, s);
  }
  g.injectedHtml = injected.html;
  g.injectionChanges = injected.changes;
  g.readme = genReadme(s, g, audit, injected);
  return g;
}

   ========================================================================== */
function renderSidebar(){
  const el = $('#sidebar');
  el.innerHTML = `<div class="sidebar-title">Wizard</div>` +
    STEPS.map((st,i)=>{
      const done = isStepComplete(st.id);
      return `<div class="step-item ${i===currentStep?'active':''} ${done?'done':''}" data-goto="${i}">
        <div class="step-num">${done?'✓':st.num}</div>
        <div>${st.label}</div>
      </div>`;
    }).join('');
}

function isStepComplete(id){
  switch(id){
    case 'website': return !!state.website.url;
    case 'code': return !!state.code.html;
    case 'identity': return !!state.identity.searchName;
    case 'brand': return !!(state.brand.fullName || state.brand.brandName);
    case 'expertise': return !!state.expertise.primaryProfession;
    case 'services': return state.services.length > 0;
    case 'audience': return state.audience.types.length > 0;
    case 'location': return !!(state.location.country || state.location.city);
    case 'projects': return state.projects.length > 0;
    case 'socials': return Object.values(state.socials).some(v => v);
    case 'seoContext': return !!state.seoContext.mainTopic;
    case 'aeo': return !!state.aeo.who;
    case 'verification': return !!state.verification.metaValue || !!state.verification.fileName || !!state.verification.dnsValue;
    case 'audit': return !!state.code.html;
    case 'preview': return true;
    case 'validation': return true;
    case 'download': return true;
  }
  return false;
}

    if(v.method === 'file' && v.fileName){

        `google-site-verification: ${v.fileName}\n`,
        'text/html']);
    }

    const checks = [
      ['Website analyzed', !!state.code.html],
      ['Search identity configured', !!state.identity.searchName],
      ['SEO metadata generated', !!g.title && !!g.description],
      ['Open Graph configured', Object.keys(g.og).length > 0],

      ['Sitemap generated', !!g.sitemap],
      ['Robots.txt generated', !!g.robotsTxt],
      ['Google verification prepared', v.method === 'skip' || !!(v.metaValue || v.fileName || v.dnsValue)],

    ];

    return `

      </div>

      <div class="card">
        <div class="card-title">Download</div>
        <div style="display:flex;gap:8px;flex-wrap:wrap;margin-top:10px">
          <button class="btn primary" data-action="download-zip">⬇ Download Complete Package (ZIP)</button>
        </div>

function extractBeforeTitle(html){
  if(!html) return '';
  try {
    const doc = new DOMParser().parseFromString(html, 'text/html');
    const t = doc.querySelector('title');
    return t ? t.textContent.trim() : '';
  } catch { return ''; }
}
function extractBeforeDesc(html){
  if(!html) return '';
  try {
    const doc = new DOMParser().parseFromString(html, 'text/html');
    const d = doc.querySelector('meta[name="description"]');
    return d ? d.getAttribute('content') : '';
  } catch { return ''; }
}
function extractBeforeCanonical(html){
  if(!html) return '';
  try {
    const doc = new DOMParser().parseFromString(html, 'text/html');
    const c = doc.querySelector('link[rel="canonical"]');
    return c ? c.getAttribute('href') : '';
  } catch { return ''; }
}

/* ==========================================================================
   RENDER: MAIN + FOOTER
   ========================================================================== */
function renderMain(){
  const step = STEPS[currentStep];
  const fn = stepRenderers[step.id];
  $('#main').innerHTML = fn ? fn() : '<div class="card">Step not implemented.</div>';
  if(step.id === 'code'){
    const ta = $('#code-input');
    if(ta){
      ta.value = state.code.html || '';
      ta.addEventListener('input', e => {
        state.code.html = e.target.value;
        saveState();
      });
    }
  }
  window.scrollTo({ top:0, behavior:'smooth' });
}

function renderFooter(){
  $('#footer-meta').textContent = `Step ${currentStep+1} of ${STEPS.length} — ${STEPS[currentStep].label}`;
  $('#btn-back').disabled = currentStep === 0;
  $('#btn-next').textContent = currentStep === STEPS.length-1 ? 'Finish' : 'Next →';
}

function render(){
  renderSidebar();
  renderMain();
  renderFooter();
}

/* ==========================================================================
   EVENT HANDLERS
   ========================================================================== */
document.addEventListener('input', e => {
  const t = e.target;
  if(t.dataset.field){
    setPath(state, t.dataset.field, t.value);
    saveState();
    if(t.dataset.field === 'identity.searchName'){
      const a = analyzeIdentity(t.value, state);
      state.identity.warning = a.warning;
      state.identity.suggestions = a.suggestions;
      if(STEPS[currentStep].id === 'identity') renderMain();
    }
  }
});

document.addEventListener('keydown', e => {
  if(e.target.dataset.chipInput && e.key === 'Enter'){
    e.preventDefault();
    const path = e.target.dataset.chipInput;
    const val = e.target.value.trim();
    if(!val) return;
    const arr = getPath(state, path) || [];
    arr.push(val);
    setPath(state, path, arr);
    e.target.value = '';
    saveState();
    renderMain();
  }
});

document.addEventListener('change', e => {
  const t = e.target;
  if(t.dataset.check){
    const path = t.dataset.check;
    const arr = getPath(state, path) || [];
    const val = t.value;
    if(t.checked){
      if(!arr.includes(val)) arr.push(val);
    } else {
      const idx = arr.indexOf(val);
      if(idx>=0) arr.splice(idx,1);
    }
    setPath(state, path, arr);
    saveState();
    const wrap = t.closest('.check');
    if(wrap) wrap.classList.toggle('checked', t.checked);
  }
  if(t.dataset.field && t.tagName === 'SELECT'){
    setPath(state, t.dataset.field, t.value);
    saveState();
    if(t.dataset.field === 'verification.method') renderMain();
  }
});

document.addEventListener('click', async e => {
  const t = e.target.closest('[data-goto],[data-add-item],[data-remove-item],[data-remove-chip],[data-use-identity],[data-action]');
  if(!t) return;

  if(t.dataset.goto !== undefined){
    currentStep = parseInt(t.dataset.goto,10);
    saveState();
    render();
    return;
  }

  if(t.dataset.addItem){
    const path = t.dataset.addItem;
    const arr = getPath(state, path) || [];
    const templates = {
      'services': { name:'', shortDescription:'', detailedDescription:'', targetAudience:'', problemSolved:'', technologies:'', keywords:'' },
      'projects': { name:'', url:'', description:'', technologies:'', category:'', client:'', date:'', image:'' },
      'faqs': { question:'', answer:'' }
    };
    arr.push(templates[path] ? clone(templates[path]) : {});
    setPath(state, path, arr);
    saveState();
    renderMain();
    return;
  }

  if(t.dataset.removeItem){
    const path = t.dataset.removeItem;
    const idx = parseInt(t.dataset.idx,10);
    const arr = getPath(state, path) || [];
    arr.splice(idx,1);
    setPath(state, path, arr);
    saveState();
    renderMain();
    return;
  }

  if(t.dataset.removeChip){
    const path = t.dataset.removeChip;
    const idx = parseInt(t.dataset.idx,10);
    const arr = getPath(state, path) || [];
    arr.splice(idx,1);
    setPath(state, path, arr);
    saveState();
    renderMain();
    return;
  }

  if(t.dataset.useIdentity){
    state.identity.searchName = t.dataset.useIdentity;
    state.identity.confirmed = true;
    saveState();
    renderMain();
    toast('Identity applied','success',1600);
    return;
  }

  if(t.dataset.action){
    handleAction(t.dataset.action, t);
  }
});

document.addEventListener('change', e => {
  if(e.target.id === 'upload-html'){
    const file = e.target.files[0];
    if(!file) return;
    const reader = new FileReader();
    reader.onload = ev => {
      state.code.html = ev.target.result;
      state.code.source = 'file';
      state.code.fileName = file.name;
      saveState();
      renderMain();
      toast('index.html loaded','success');
    };
    reader.readAsText(file);
  }
});

async function handleAction(action, el){
  switch(action){
    case 'analyze-identity': {
      const a = analyzeIdentity(state.identity.searchName, state);
      state.identity.warning = a.warning;
      state.identity.suggestions = a.suggestions;
      saveState();
      renderMain();
      if(!a.warning) toast('Identity looks distinctive ✓','success');
      else toast('Identity warning applied','warn');
      break;
    }
    case 'regen-title': {
      state.generated.title = genTitle(state);
      saveState();
      renderMain();
      break;
    }
    case 'regen-desc': {
      state.generated.description = genDescription(state);
      saveState();
      renderMain();
      break;
    }
    case 'clear-html': {
      if(confirm('Clear the loaded index.html?')){
        state.code.html = '';
        state.code.fileName = '';
        saveState();
        renderMain();
      }
      break;
    }
    case 'sample-html': {
      state.code.html = sampleHtml();
      saveState();
      renderMain();
      toast('Sample HTML loaded','success');
      break;
    }
    case 'download-zip': {
      await downloadZip();
      break;
    }
    case 'download-file': {
      const g = generateAll();
      const p = el.dataset.path;
      const map = {
        'index.html': g.injectedHtml || '',
        'sitemap.xml': g.sitemap,
        'robots.txt': g.robotsTxt,
        'schema.json': JSON.stringify(g.jsonld, null, 2),
        'llms.txt': g.llms,
        'SEO-README.txt': g.readme
      };
      if(p.startsWith('google-verification/') && state.verification.fileName){
        download(state.verification.fileName, `google-site-verification: ${state.verification.fileName}\n`, 'text/html');
        return;
      }
      const content = map[p];
      if(content === undefined){ toast('File not found','error'); return; }
      download(p.split('/').pop(), content);
      toast('Downloaded ' + p.split('/').pop(), 'success');
      break;
    }
    case 'copy-head': {
      const g = generateAll();
      const lines = [];
      lines.push(`<title>${g.title}</title>`);
      lines.push(`<meta name="description" content="${g.description}">`);
      if(g.canonical) lines.push(`<link rel="canonical" href="${g.canonical}">`);
      lines.push(`<meta name="robots" content="${g.robots}">`);
      Object.entries(g.og).forEach(([k,v]) => lines.push(`<meta property="${k}" content="${v}">`));
      Object.entries(g.twitter).forEach(([k,v]) => lines.push(`<meta name="${k}" content="${v}">`));
      if(state.verification.method === 'meta' && state.verification.metaValue)
        lines.push(`<meta name="google-site-verification" content="${state.verification.metaValue}">`);
      // NOTE: closing script tag must be escaped as <\/script> so this
      // outer <script> block is not terminated by the HTML parser.
      lines.push(`<script type="application/ld+json">\n${JSON.stringify(g.jsonld,null,2)}\n<\/script>`);
      copy(lines.join('\n'));
      break;
    }
    case 'copy-sitemap-url': {
      const base = state.website.url ? normalizeUrl(state.website.url) : 'https://yourdomain.com';
      copy(base + '/sitemap.xml');
      break;
    }
    case 'copy-gsc': {
      const base = state.website.url ? normalizeUrl(state.website.url) : 'https://yourdomain.com';
      copy(
`Google Search Console — Step by Step

1. Open https://search.google.com/search-console
2. Add a property (URL prefix or Domain).
3. Verify using your chosen method (meta tag / file / DNS).
4. Once verified, go to "Sitemaps" in the left menu.
5. Enter the sitemap path: sitemap.xml
   Full URL: ${base}/sitemap.xml
6. Click Submit.
7. Check "Coverage" after 24-72 hours for indexing status.

Note: Verification must be done by the domain owner.
Optimization does not guarantee indexing or rankings.`);
      break;
    }
    case 'copy-jsonld': {
      const g = generateAll();
      copy(JSON.stringify(g.jsonld, null, 2));
      break;
    }
  }
}

/* ==========================================================================
   ZIP EXPORT — README template must escape closing script tag
   ========================================================================== */
async function downloadZip(){
  const g = generateAll();
  const v = state.verification;
  const zip = new JSZip();
  const root = zip.folder('SEO-AEO-Package');

  if(g.injectedHtml) {
    root.file('index.html', g.injectedHtml);
  } else {
    root.file('index.html.README.txt',
`No existing index.html was provided.

Paste the following tags into the head of your website manually:

<title>${g.title}</title>
<meta name="description" content="${g.description}">
<link rel="canonical" href="${g.canonical}">
<meta name="robots" content="${g.robots}">

Open Graph:
${Object.entries(g.og).map(([k,val]) => `<meta property="${k}" content="${val}">`).join('\n')}

Twitter:
${Object.entries(g.twitter).map(([k,val]) => `<meta name="${k}" content="${val}">`).join('\n')}

JSON-LD:
<script type="application/ld+json">
${JSON.stringify(g.jsonld, null, 2)}
<\/script>
`);
  }

  root.file('robots.txt', g.robotsTxt);
  root.file('sitemap.xml', g.sitemap);
  root.file('schema.json', JSON.stringify(g.jsonld, null, 2));
  root.file('llms.txt', g.llms);
  root.file('SEO-README.txt', g.readme);

  if(v.method === 'file' && v.fileName){
    const gf = root.folder('google-verification');
    gf.file(v.fileName, `google-site-verification: ${v.fileName}\n`);
  }

  const blob = await zip.generateAsync({ type:'blob' });
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  a.href = url; a.download = 'SEO-AEO-Package.zip';
  document.body.appendChild(a); a.click();
  setTimeout(()=>{ URL.revokeObjectURL(url); a.remove(); }, 100);
  toast('Package downloaded ✓','success');
}

$('#btn-next').addEventListener('click', ()=>{

    saveState();
    render();

  }
});
$('#btn-back').addEventListener('click', ()=>{

$('#btn-reset').addEventListener('click', ()=>{

    localStorage.removeItem(STORAGE_KEY);

    render();
    toast('Reset complete','success');
  }
});
$('#btn-export-json').addEventListener('click', ()=>{
  download('seo-aeo-form-data.json', JSON.stringify(state, null, 2), 'application/json');
  toast('Exported form data','success');
});
